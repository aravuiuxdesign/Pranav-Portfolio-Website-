<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects — Pranav Gadekar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
a{color:#000;text-decoration:none}a:hover{color:#2D5BFF}
a:focus-visible,button:focus-visible{outline:2px solid #2D5BFF;outline-offset:3px}
img,video{display:block;max-width:100%}
.arrive{position:fixed;inset:0;z-index:300;background:#000;display:flex;align-items:center;justify-content:center;animation:lift 1s cubic-bezier(.76,0,.24,1) .4s forwards;pointer-events:none}
.arrive-mark{width:14px;height:14px;background:#FFF;box-shadow:14px 0 #FFF,28px 0 #FFF,0 14px #FFF,42px 14px #FFF,0 28px #FFF,42px 28px #FFF,0 42px #FFF,14px 42px #FFF,28px 42px #FFF,0 56px #FFF,0 70px #FFF;transform:translate(-21px,-35px)}
@keyframes lift{to{transform:translateY(-100%)}}
.pill{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 20px;border-radius:999px;font:500 13px 'Geist',sans-serif;letter-spacing:.06em;text-transform:uppercase;border:0;cursor:pointer;transition:background .3s,color .3s}
.pill-dark{background:#151A2B;color:#FFF}.pill-dark:hover{background:#2D5BFF;color:#FFF}
.pill-light{background:#EEF1F8;color:#000}.pill-light:hover{background:#E3E7F0;color:#000}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.card{display:block;color:#000;cursor:zoom-in;background:none;border:0;padding:0;text-align:left;font:inherit;width:100%}
.card .f{position:relative;overflow:hidden;border-radius:12px;background:#F5F7FB}
.card .f img,.card .f video{width:100%;height:100%;object-fit:cover;transition:scale 1.1s cubic-bezier(.16,1,.3,1)}
.card:hover .f img,.card:hover .f video{scale:1.05}
.rv{opacity:0;transform:translateY(36px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
.mas{columns:3 320px;column-gap:16px}
.mas>*{break-inside:avoid;margin-bottom:24px}
@media (prefers-reduced-motion:reduce){.arrive{display:none}.rv{opacity:1;transform:none;transition:none}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
.meta-row{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid #EAECF2}
.h-hero{font-size:clamp(56px,10.4vw,210px);line-height:.92;letter-spacing:-.055em;font-weight:400}
.h-cta{font-size:clamp(64px,10vw,190px);line-height:.92;letter-spacing:-.055em;font-weight:400}
.hero-info{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:32px;margin-top:clamp(32px,3.4vw,64px);padding-top:18px;border-top:1px solid #EAECF2;align-items:start}
.hdr{transition:background .35s,border-color .35s,backdrop-filter .35s;border-bottom:1px solid transparent}
.hdr.scrolled{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:#EAECF2}
.ul{position:relative}.ul::after{content:"";position:absolute;left:0;bottom:-3px;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.7,0,.2,1)}.ul:hover::after{transform:scaleX(1);transform-origin:left}
.fl{display:block;font-size:clamp(16px,1.2vw,20px);line-height:1.8;color:#FFFFFF}
.wordmark{font-size:clamp(56px,13.2vw,280px);line-height:.85;letter-spacing:-.06em;font-weight:500;white-space:nowrap;margin:clamp(56px,6vw,120px) 0 22px;color:#FFFFFF}
.fade-in{animation:fadein 1.2s ease .4s both}@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:820px){.hero-info{grid-template-columns:1fr}.hero-info>div{justify-content:flex-start !important}.h-hero .ln{padding-left:0 !important}}
.pill-blue{background:#2D5BFF;color:#FFF}.pill-blue:hover{background:#1E3FE0;color:#FFF}
h1,h2,h3{text-wrap:balance}
.rv{filter:blur(6px);transform:translateY(28px)}.rv.in{filter:none}
.rv{transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.3s cubic-bezier(.22,1,.36,1),filter 1.1s cubic-bezier(.22,1,.36,1)}
.ln>span{transition:transform 1.4s cubic-bezier(.22,1,.36,1)}
.pill{transition:background .35s cubic-bezier(.22,1,.36,1),color .35s,transform .6s cubic-bezier(.22,1,.36,1),box-shadow .35s}
.pill-dark:hover,.pill-blue:hover{box-shadow:0 10px 30px rgba(45,91,255,.28)}
::selection{background:#2D5BFF;color:#FFF}

/* ===== page transition v2 ===== */
.pt{position:fixed;inset:0;z-index:320;pointer-events:none;overflow:hidden}
.pt-a,.pt-b{position:absolute;inset:0;transform:translateY(112%);will-change:transform}
.pt-a{background:linear-gradient(135deg,#4F7BFF 0%,#2D5BFF 50%,#5B4BFF 100%)}
.pt-b{background:#0B0D14;display:flex;align-items:center;justify-content:center}
.pt-a::before,.pt-b::before,.pt-a::after,.pt-b::after{content:"";position:absolute;left:-15%;right:-15%;height:22vh;border-radius:50%;background:inherit}
.pt-a::before,.pt-b::before{top:-11vh}
.pt-a::after,.pt-b::after{bottom:-11vh}
.pt-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:26px;color:#FFF;opacity:0;transform:translateY(18px)}
.pt-mark{width:10px;height:10px;background:#FFF;transform:translate(-15px,-25px);box-shadow:10px 0 #FFF,20px 0 #FFF,0 10px #FFF,30px 10px #FFF,0 20px #FFF,30px 20px #FFF,0 30px #FFF,10px 30px #FFF,20px 30px #FFF,0 40px #FFF,0 50px #FFF;margin-bottom:-30px}
.pt-lbl{font-family:'Geist',system-ui,sans-serif;font-size:clamp(28px,3.2vw,54px);font-weight:400;letter-spacing:-.04em;line-height:1;margin-top:26px}
.pt.out{pointer-events:auto}
.pt.out .pt-a{animation:ptIn .8s cubic-bezier(.76,0,.24,1) forwards}
.pt.out .pt-b{animation:ptIn .8s cubic-bezier(.76,0,.24,1) .1s forwards}
.pt.out .pt-in{opacity:1;transform:none;transition:opacity .45s ease .5s,transform .7s cubic-bezier(.22,1,.36,1) .5s}
@keyframes ptIn{from{transform:translateY(112%)}to{transform:translateY(0)}}
.pt.arr .pt-a,.pt.arr .pt-b{transform:translateY(0)}
.pt.arr .pt-in{opacity:1;transform:none;animation:ptFade .4s ease .2s forwards}
.pt.arr .pt-b{animation:ptOut 1s cubic-bezier(.76,0,.24,1) .45s forwards}
.pt.arr .pt-a{animation:ptOut 1s cubic-bezier(.76,0,.24,1) .58s forwards}
@keyframes ptOut{to{transform:translateY(-112%)}}
@keyframes ptFade{to{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.pt{display:none}}

/* back button */
.pg-back{position:fixed;top:21px;right:clamp(14px,2vw,28px);z-index:90;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px 0 16px;border-radius:999px;background:#0B0D14;color:#FFF !important;font:500 14.5px/1 'Geist',system-ui,sans-serif;text-decoration:none;box-shadow:0 14px 34px -14px rgba(11,13,20,.55);transition:transform .45s cubic-bezier(.22,1,.36,1),background .3s}
.pg-back:hover{transform:translateX(-3px);background:#1E2230}
.pg-back svg{transition:transform .45s cubic-bezier(.22,1,.36,1)}.pg-back:hover svg{transform:translateX(-3px)}
@media (max-width:820px){.pg-back{top:auto;bottom:18px;right:16px}}
.ex-nav{padding-right:150px !important}@media (max-width:820px){.ex-nav{padding-right:clamp(20px,3.4vw,48px) !important}}

/* ===== v26 page transition = preloader style ===== */
.pt{display:block!important}
.pt-a{display:none!important}
.pt-b{background:#000!important}
.pt-a::before,.pt-b::before,.pt-a::after,.pt-b::after{display:none!important}
.pt-in{display:none!important}
.ptx{display:grid;grid-template-columns:repeat(4,22px);grid-auto-rows:22px}
.ptx i{background:#FFF;opacity:0}
.pt.out .ptx i,.pt.arr .ptx i{animation:ptpx .4s steps(1) forwards}
@keyframes ptpx{to{opacity:1}}
.ptc{position:absolute;left:clamp(20px,3.4vw,48px);bottom:12px;color:#FFF;font:300 clamp(64px,10vw,150px)/1 'Geist',sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ptn{position:absolute;right:clamp(20px,3.4vw,48px);bottom:28px;color:#FFF;font:500 12px 'Geist',sans-serif;letter-spacing:.2em;text-transform:uppercase}
.pt.out .pt-b{animation-duration:.75s!important;animation-delay:0s!important}
.pt.arr .pt-b{animation-delay:.55s!important}

/* mobile fixes */
html,body{overflow-x:clip}


/* ===== v34 theme toggle ===== */
.thm{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:42px;height:42px;border:0;border-radius:50%;background:#F1F3F8;color:#0B0D14;cursor:pointer;transition:background .3s,color .3s,transform .4s cubic-bezier(.22,1,.36,1)}
.thm:hover{background:#E5E9F3;transform:rotate(-12deg)}
.thm svg{position:absolute;transition:opacity .35s,transform .5s cubic-bezier(.22,1,.36,1)}
.thm .ic-sun{opacity:0;transform:rotate(-60deg) scale(.6)}
html[data-theme="dark"] .thm .ic-sun{opacity:1;transform:none}
html[data-theme="dark"] .thm .ic-moon{opacity:0;transform:rotate(60deg) scale(.6)}
.thm:focus-visible{outline:2px solid #2D5BFF;outline-offset:3px}
.thm-fx{position:fixed;bottom:20px;right:20px;z-index:120;width:46px;height:46px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px -12px rgba(15,23,42,.3),inset 0 0 0 1px #E6E9F1}
html[data-theme="dark"] .thm{background:rgba(255,255,255,.08);color:#FFF}
html[data-theme="dark"] .thm:hover{background:rgba(255,255,255,.14)}
html[data-theme="dark"] .thm-fx{background:rgba(18,20,30,.8);box-shadow:0 10px 30px -12px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.1)}
html.thm-anim,html.thm-anim body,html.thm-anim *:not(video):not(canvas){transition:background-color .55s ease,color .45s ease,border-color .45s ease,box-shadow .45s ease!important}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"],html[data-theme="dark"] body{background:#07080D!important}
html[data-theme="dark"] .pfroot{background:#07080D!important;color:#E8EBF3!important}
html[data-theme="dark"] ::selection{background:#3D55FF;color:#FFF}



/* ===== v40 Explorations redesign ===== */
.xroot{--ink:#0B0D14;--mut:#5E6372;--line:#E7EBF2;--soft:#F5F7FB;--card:#FFFFFF;--acc:#2638FF;--gx:clamp(20px,5vw,112px);overflow-x:clip}
.xw{max-width:1440px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gx)}
.it{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--acc);letter-spacing:-.01em}
.xroot a:hover{color:inherit}
/* nav */
.xn-wrap{position:fixed;top:16px;left:0;right:0;z-index:80;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.xn{pointer-events:auto;display:flex;align-items:center;gap:6px;height:60px;padding:0 8px 0 20px;border-radius:999px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(227,231,240,.9);box-shadow:0 20px 50px -28px rgba(30,45,120,.35)}
.xn-logo{display:flex;align-items:center;gap:12px;margin-right:18px;color:var(--ink)}
.xn-logo svg{fill:var(--ink)}
.xn-sep{width:1px;height:20px;background:var(--line)}
.xn-name{font-size:16px;font-weight:500}
.xn-links{display:flex;gap:2px;margin-right:6px}
.xn-links a{padding:9px 14px;border-radius:99px;font-size:15px;color:#3A3F4F;transition:background .25s,color .25s}
.xn-links a:hover{background:#F1F3F8;color:var(--ink)}
.xn-links a.on{background:var(--ink);color:#FFF}
.xn .thm{margin-right:6px}
.xn-cta{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 20px;border-radius:99px;background:var(--acc);color:#FFF!important;font-size:15px;font-weight:500;box-shadow:0 12px 26px -12px rgba(38,56,255,.6);transition:transform .3s,box-shadow .3s}
.xn-cta:hover{transform:translateY(-1px);box-shadow:0 16px 30px -12px rgba(38,56,255,.7)}
.xn-arc{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#FFF;color:var(--acc);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.xn-cta:hover .xn-arc,.xbtn:hover .xn-arc{transform:translateX(3px) rotate(-45deg)}
/* hero */
.xh{position:relative;padding:clamp(130px,15vh,170px) 0 clamp(48px,6vw,80px);overflow:hidden}
.xh-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(38,56,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(38,56,255,.06) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 70% 70% at 50% 30%,#000 10%,transparent 75%);pointer-events:none}
.xh-glow{position:absolute;left:50%;top:-10%;width:min(1200px,110vw);height:620px;transform:translateX(-50%);filter:blur(80px);opacity:.5;pointer-events:none}
.xh-glow span{position:absolute;border-radius:50%;animation:xglow 18s ease-in-out infinite alternate}
.xh-glow span:nth-child(1){left:10%;top:20%;width:40%;height:60%;background:#9AAEFF}
.xh-glow span:nth-child(2){right:8%;top:10%;width:38%;height:62%;background:#C4B3FF;animation-delay:-6s}
.xh-glow span:nth-child(3){left:38%;top:40%;width:30%;height:50%;background:#A6E8FF;animation-delay:-11s}
@keyframes xglow{50%{transform:translate(4%,-5%) scale(1.07)}100%{transform:translate(-4%,4%) scale(.96)}}
.xh-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.xh-crumb{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)!important;margin-bottom:26px;transition:color .25s}
.xh-crumb span{opacity:.5}.xh-crumb b{font-weight:500;color:var(--ink)}
.xh-crumb:hover{color:var(--acc)!important}
.xh-crumb svg{transition:transform .3s}.xh-crumb:hover svg{transform:translateX(-3px)}
.xeb{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 4px;border-radius:99px;background:rgba(255,255,255,.8);border:1px solid var(--line);font:500 11.5px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.xeb b{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--acc);color:#FFF;font-weight:500;font-size:10.5px}
.xh-t{margin:20px 0 0;font-size:clamp(56px,9vw,148px);line-height:.92;letter-spacing:-.055em;font-weight:500;color:var(--ink)}
.xh-t .it{font-size:1.08em;font-weight:400}
.xh-p{margin:24px auto 0;max-width:54ch;font-size:clamp(16px,1.25vw,19px);line-height:1.55;color:var(--mut)}
.xh-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(820px,100%);margin-top:clamp(32px,4vw,52px)}
.xst{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 20px;border-radius:20px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);text-align:left;color:var(--ink)!important;transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .4s,border-color .3s}
.xst:hover{transform:translateY(-4px);border-color:rgba(38,56,255,.3);box-shadow:0 24px 40px -26px rgba(38,56,255,.5)}
.xst b{font-size:clamp(28px,2.6vw,40px);font-weight:500;letter-spacing:-.04em;line-height:1}
.xst span{font:500 11px/1.2 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
/* sticky tabs */
.xtabs-wrap{position:sticky;top:88px;z-index:60;display:flex;justify-content:center;padding:0 16px;margin-top:-6px;pointer-events:none;transition:top .3s}
.xtabs{pointer-events:auto;position:relative;display:flex;gap:2px;padding:5px;border-radius:99px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 34px -22px rgba(30,45,120,.4)}
.xtab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;font-size:14.5px;font-weight:500;color:#3A3F4F!important;transition:color .3s;white-space:nowrap}
.xtab i{font-style:normal;font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:99px;background:#EEF1F8;color:var(--mut);transition:background .3s,color .3s}
.xtab:hover{color:var(--ink)!important}
.xtab.on{color:#FFF!important}
.xtab.on i{background:rgba(255,255,255,.18);color:#FFF}
.xtab-ind{position:absolute;left:0;top:5px;bottom:5px;border-radius:99px;background:var(--ink);opacity:0;transition:transform .5s cubic-bezier(.22,1,.36,1),width .5s cubic-bezier(.22,1,.36,1),opacity .3s}
/* sections */
.xs{padding:clamp(72px,8vw,128px) 0}
.xs-tint{background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.xs-h{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,4vw,72px);align-items:end;margin-bottom:clamp(28px,3vw,40px)}
.xs-h h2{margin:18px 0 0;font-size:clamp(40px,4.6vw,76px);line-height:1;letter-spacing:-.045em;font-weight:500;color:var(--ink)}
.xs-r p{margin:0;max-width:44ch;color:var(--mut);font-size:16px;line-height:1.55}
.xchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.xchips span{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:#3A3F4F}
.xf{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(24px,2.6vw,36px)}
.xf-b{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font:500 14px 'Geist',sans-serif;color:#3A3F4F;cursor:pointer;transition:background .3s,color .3s,border-color .3s,scale .2s}
.xf-b i{font-style:normal;font:500 11px 'Geist Mono',monospace;color:var(--mut)}
.xf-b:hover{border-color:#C9D2EC;color:var(--ink)}
.xf-b:active{scale:.96}
.xf-b[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FFF}
.xf-b[aria-pressed="true"] i{color:rgba(255,255,255,.6)}
/* graphic masonry */
.xmas{columns:4 260px;column-gap:20px}
.xc{display:block;width:100%;margin:0 0 26px;padding:0;border:0;background:none;text-align:left;font:inherit;color:var(--ink);cursor:zoom-in;break-inside:avoid}
.xc-f{position:relative;display:block;overflow:hidden;border-radius:18px;background:var(--soft);box-shadow:0 0 0 1px rgba(11,13,20,.05);transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s}
.xc-f img{width:100%;height:auto;transition:scale 1s cubic-bezier(.16,1,.3,1)}
.xc:hover .xc-f{transform:translateY(-4px);box-shadow:0 0 0 1px rgba(38,56,255,.18),0 30px 50px -30px rgba(20,35,110,.45)}
.xc:hover .xc-f img{scale:1.04}
.xc-zoom{position:absolute;right:12px;top:12px;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 8px 18px -8px rgba(0,0,0,.4);opacity:0;transform:scale(.7);transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.xc:hover .xc-zoom,.xc:focus-visible .xc-zoom{opacity:1;transform:none}
.xc-m{display:flex;flex-direction:column;gap:4px;padding:14px 4px 0}
.xc-m b{font-size:16px;font-weight:500;letter-spacing:-.01em;line-height:1.3}
.xc-m span{font:500 11px/1.3 'Geist Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
/* 3D grid */
.x3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
.x3c{margin:0}
.x3f{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#E9EDF5;box-shadow:0 0 0 1px rgba(11,13,20,.05);transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s}

.x3c figcaption b{font-size:16px;font-weight:500;letter-spacing:-.01em}

/* games */
.xg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.xgc{padding:14px;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 60px -48px rgba(20,35,110,.4);transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s}
.xgc:hover{transform:translateY(-4px);box-shadow:0 40px 70px -40px rgba(20,35,110,.45)}
.xgv{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0B0D14}
.xgv video{width:100%;height:100%;object-fit:cover}
.xgt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.xgt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.xgt-1{grid-template-columns:1fr}.xgt-1 img{aspect-ratio:32/9}
.xgm{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:20px 8px 8px}
.xgm h3{margin:0;font-size:clamp(26px,2.2vw,34px);font-weight:500;letter-spacing:-.035em;color:var(--ink)}

.xgm .xchips{margin:0;justify-content:flex-end}
/* CTA */
.xcta-wrap{padding-bottom:clamp(40px,5vw,72px)}
.xcta{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px;padding:clamp(36px,5vw,72px);border-radius:32px;background:#0B0D14;color:#FFF}
.xcta-glow{position:absolute;right:-10%;top:-60%;width:60%;height:180%;background:radial-gradient(closest-side,rgba(38,56,255,.55),transparent);filter:blur(30px);pointer-events:none}
.xcta>*{position:relative}
.xcta h2{margin:18px 0 0;max-width:16ch;font-size:clamp(34px,4.2vw,64px);line-height:1.02;letter-spacing:-.045em;font-weight:500;color:#FFF}
.xcta h2 .it{color:#8EA2FF}
.xeb-d{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#FFF}
.xcta-b{display:flex;flex-wrap:wrap;gap:10px}
.xbtn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 22px;border-radius:99px;font-size:15.5px;font-weight:500;transition:transform .3s,background .3s,scale .2s}
.xbtn:active{scale:.96}
.xbtn-w{background:#FFF;color:#0B0D14!important;padding-right:8px}
.xbtn-w .xn-arc{background:var(--acc);color:#FFF}
.xbtn-o{border:1px solid rgba(255,255,255,.2);color:#FFF!important}
.xbtn-o:hover{background:rgba(255,255,255,.08)}
/* lightbox */
.xlb{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;gap:16px;padding:clamp(16px,4vw,56px);background:rgba(8,9,14,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:xfade .3s ease}
@keyframes xfade{from{opacity:0}}
.xlb-f{margin:0;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:min(1100px,100%);animation:xpop .4s cubic-bezier(.22,1,.36,1)}
@keyframes xpop{from{opacity:0;transform:scale(.96)}}
.xlb-f img{max-width:100%;max-height:78vh;border-radius:14px;object-fit:contain;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.xlb-f figcaption{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:10px;color:#FFF;text-align:center}
.xlb-f b{font-size:17px;font-weight:500}
.xlb-f span{font:500 11px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#A7ADC0}
.xlb-f em{font:500 11px 'Geist Mono',monospace;font-style:normal;color:#A7ADC0;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08)}
.xlb-n,.xlb-x{display:inline-flex;align-items:center;justify-content:center;flex:none;width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#FFF;cursor:pointer;transition:background .25s,scale .2s}
.xlb-n:hover,.xlb-x:hover{background:rgba(255,255,255,.2)}
.xlb-n:active,.xlb-x:active{scale:.92}
.xlb-x{position:absolute;right:20px;top:20px}
/* responsive */
@media (max-width:1100px){.x3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.xn-links,.xn-sep,.xn-name{display:none}.xn-logo{margin-right:auto}.xn{gap:8px;padding-left:18px}.xs-h{grid-template-columns:1fr}.xg{grid-template-columns:1fr}.xh-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .xn{height:56px}.xn-cta{height:42px;font-size:14px;padding-left:16px}.xn-arc{width:30px;height:30px}

  .xtabs{max-width:100%;overflow-x:auto;scrollbar-width:none}.xtabs::-webkit-scrollbar{display:none}.xtab{height:38px;padding:0 12px;font-size:13.5px}
  .xtabs-wrap{top:80px}
  .xmas{columns:2;column-gap:12px}.xc{margin-bottom:18px}.xc-f{border-radius:14px}.xc-m b{font-size:14px}.xc-m span{font-size:10px}
  .x3{grid-template-columns:1fr;gap:22px}
  .xgm{flex-direction:column;align-items:flex-start}.xgm .xchips{justify-content:flex-start}
  .xlb-n{position:absolute;bottom:20px;width:44px;height:44px}.xlb-p{left:calc(50% - 54px)}.xlb-nx{right:calc(50% - 54px)}
  .xlb-f img{max-height:70vh}
}
@media (prefers-reduced-motion:reduce){.xh-glow span,.x3b i{animation:none}}
@media (max-width:640px){.xf{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1*var(--gx));margin-right:calc(-1*var(--gx));padding:0 var(--gx)}.xf::-webkit-scrollbar{display:none}.xf-b{flex:none}.xtab i{display:none}.xtab{padding:0 14px}}
/* dark */

/* ===== v41 creative Explorations: canvas + index ===== */
html.cv-lock,html.cv-lock body{overflow:hidden;overscroll-behavior:none}
.xv-index .cv{display:none}.xv-canvas .ix{display:none}
.xv-index .tb-cv{display:none}
/* canvas */
.cv{position:fixed;inset:0;z-index:1;overflow:hidden;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;background-color:#F3F4F8;background-image:radial-gradient(circle,rgba(11,13,20,.16) 1.1px,transparent 1.3px);background-size:26px 26px}
.cv.dragging{cursor:grabbing}
.cv.dragging .cv-c{pointer-events:none}
.cv-world{position:absolute;left:0;top:0;display:flex;align-items:flex-start;gap:220px;padding:160px 200px 220px;transform-origin:0 0;will-change:transform;--z:1}
.cv-col{display:flex;flex-direction:column;gap:200px;width:1360px}
.cv-col-2{width:1240px;margin-top:260px}
/* title written on canvas */
.cv-title{position:relative;padding:0 0 10px}
.cv-eb{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 14px;border-radius:99px;background:#FFF;border:1px solid #E3E7F0;font:500 13px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#0B0D14}
.cv-eb i{width:8px;height:8px;border-radius:50%;background:#2638FF;box-shadow:0 0 0 4px rgba(38,56,255,.15)}
.cv-title h1{margin:28px 0 0;font-size:250px;line-height:.86;letter-spacing:-.06em;font-weight:500;color:#0B0D14}
.cv-title h1 .it{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.06em;color:#2638FF;letter-spacing:-.02em}
.cv-title p{margin:34px 0 0;max-width:36ch;font-size:30px;line-height:1.4;color:#4A5062}
.cv-hint{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:34px;font-size:20px;color:#5E6372}
.cv-kbd{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:9px;background:#FFF;border:1px solid #DDE2EC;box-shadow:0 2px 0 #DDE2EC;font:500 16px 'Geist Mono',monospace;color:#0B0D14}
.cv-dot{width:5px;height:5px;border-radius:50%;background:#B5BBCA}
/* frames */
.cv-fr{position:relative}
.cv-fl{position:absolute;left:0;right:0;bottom:100%;display:flex;justify-content:space-between;align-items:center;padding-bottom:calc(10px / var(--z));font:500 calc(13px / var(--z))/1 'Geist Mono',monospace;letter-spacing:.02em;color:#6B7183;white-space:nowrap}
.cv-fl i{font-style:normal;color:#2638FF;margin-right:calc(6px / var(--z))}
.cv-fb{padding:40px;border-radius:28px;background:#FFF;box-shadow:0 0 0 1px rgba(11,13,20,.06),0 40px 80px -50px rgba(20,35,110,.35)}
.cv-mas{columns:4;column-gap:28px}
.cv-mas .cv-c{margin-bottom:34px;break-inside:avoid}
.cv-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 26px}
.cv-g3 .cv-m{aspect-ratio:4/3}
.cv-g5{display:grid;grid-template-columns:repeat(5,1fr);gap:28px 20px}
.cv-g5 .cv-m{aspect-ratio:1}
.cv-gm{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.cv-big .cv-m{aspect-ratio:16/9}
.cv-gmt{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:14px;margin-top:16px}
.cv-gmt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;pointer-events:none}
/* card + figma selection */
.cv-c{position:relative;display:block;width:100%;padding:0;border:0;background:none;text-align:left;font:inherit;color:#0B0D14;cursor:zoom-in}
.cv-m{position:relative;display:block;overflow:hidden;border-radius:16px;background:#EEF1F7}
.cv-m img,.cv-m video{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:scale .9s cubic-bezier(.16,1,.3,1)}
.cv-mas .cv-m img{height:auto}
.cv-c:hover .cv-m img,.cv-c:hover .cv-m video{scale:1.035}
.cv-sel{position:absolute;inset:calc(-6px / var(--z));bottom:auto;height:calc(100% - var(--caph,0px));pointer-events:none;border:calc(1.6px / var(--z)) solid #2638FF;border-radius:4px;opacity:0;transition:opacity .2s}
.cv-c .cv-sel{height:auto;bottom:auto}
.cv-sel b{position:absolute;width:calc(9px / var(--z));height:calc(9px / var(--z));background:#FFF;border:calc(1.6px / var(--z)) solid #2638FF;border-radius:2px}
.cv-sel b:nth-child(1){left:calc(-5px / var(--z));top:calc(-5px / var(--z))}.cv-sel b:nth-child(2){right:calc(-5px / var(--z));top:calc(-5px / var(--z))}
.cv-sel b:nth-child(3){left:calc(-5px / var(--z));bottom:calc(-5px / var(--z))}.cv-sel b:nth-child(4){right:calc(-5px / var(--z));bottom:calc(-5px / var(--z))}
.cv-sel em{position:absolute;left:calc(-1.6px / var(--z));bottom:calc(100% + 6px / var(--z));padding:calc(4px / var(--z)) calc(7px / var(--z));border-radius:calc(4px / var(--z));background:#2638FF;color:#FFF;font:500 calc(11px / var(--z))/1 'Geist',sans-serif;font-style:normal;white-space:nowrap}
.cv-c:hover .cv-sel,.cv-c:focus-visible .cv-sel{opacity:1}
.cv-c:focus-visible{outline:none}
.cv-cap{display:flex;flex-direction:column;gap:6px;padding:14px 2px 0}
.cv-cap b{font-size:19px;font-weight:500;letter-spacing:-.015em;line-height:1.25}
.cv-cap span{font:500 12px/1.3 'Geist Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:#7A8094}
.cv-rec{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:99px;background:rgba(11,13,20,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#FFF;font:500 11px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.cv-rec i{width:6px;height:6px;border-radius:50%;background:#FF4D5E;animation:xrec 1.6s ease-in-out infinite}
/* next card */
.cv-next{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:26px;padding:56px;border-radius:32px;background:#0B0D14;color:#FFF!important;cursor:pointer}
.cv-next::before{content:"";position:absolute;right:-20%;top:-60%;width:70%;height:200%;background:radial-gradient(closest-side,rgba(38,56,255,.6),transparent);filter:blur(20px)}
.cv-next>*{position:relative}
.cv-next b{max-width:16ch;font-size:64px;line-height:1.02;letter-spacing:-.045em;font-weight:500}
.cv-next b .it{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#8EA2FF}
.cv-eb-d{align-self:flex-start;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#FFF}
.cv-next-a{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;height:56px;padding:0 24px;border-radius:99px;background:#FFF;color:#0B0D14;font-size:17px;font-weight:500;transition:transform .35s}
.cv-next:hover .cv-next-a{transform:translateX(6px)}
/* minimap */
.cv-mini{position:fixed;right:24px;bottom:24px;z-index:5;padding:0;border-radius:12px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(11,13,20,.08),0 18px 40px -20px rgba(20,35,110,.4);overflow:hidden;cursor:pointer}
.cv-mini-w{position:absolute;inset:0}
.cv-mini-w i{position:absolute;border-radius:2px;background:#DDE3F0;transition:background .2s}
.cv-mini-w i:hover{background:#B9C6F5}
.cv-mini-v{position:absolute;left:0;top:0;border:1.5px solid #2638FF;border-radius:3px;background:rgba(38,56,255,.06);pointer-events:none}
/* tip */
.cv-tip{position:fixed;left:50%;top:96px;z-index:6;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 12px;transform:translateX(-50%);border-radius:99px;background:#0B0D14;color:#FFF;font-size:14px;font-weight:500;box-shadow:0 18px 40px -16px rgba(11,13,20,.6);pointer-events:none;transition:opacity .5s,transform .5s}
.cv-tip-h{display:inline-flex;animation:xhand 1.8s ease-in-out infinite}
@keyframes xhand{0%,100%{transform:translateX(-4px)}50%{transform:translateX(6px)}}
.cv-tip.gone{opacity:0;transform:translate(-50%,-10px)}
/* toolbar */
.tb{position:fixed;left:50%;bottom:22px;z-index:70;display:flex;align-items:center;gap:4px;max-width:calc(100vw - 32px);padding:6px;transform:translateX(-50%);border-radius:18px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 0 0 1px rgba(11,13,20,.08),0 24px 50px -24px rgba(20,35,110,.45)}
.tb-seg{display:flex;gap:2px;padding:3px;border-radius:13px;background:#EEF1F7}
.tb-v{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:10px;background:none;font:500 14px 'Geist',sans-serif;color:#4A5062;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s,scale .2s}
.tb-v[aria-pressed="true"]{background:#FFF;color:#0B0D14;box-shadow:0 2px 8px -2px rgba(11,13,20,.2)}
.tb-v:active,.tb-j:active,.tb-i:active{scale:.94}
.tb-cv{display:flex;align-items:center;gap:2px}
.tb-sep{width:1px;height:22px;margin:0 6px;background:#E1E5EE}
.tb-j{height:36px;padding:0 12px;border:0;border-radius:10px;background:none;font:500 14px 'Geist',sans-serif;color:#4A5062;cursor:pointer;transition:background .25s,color .25s}
.tb-j:hover{background:#F1F3F8;color:#0B0D14}
.tb-j.on{background:#0B0D14;color:#FFF}
.tb-i{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:10px;background:none;color:#4A5062;cursor:pointer;transition:background .25s,color .25s}
.tb-i:hover{background:#F1F3F8;color:#0B0D14}
.tb-z{min-width:48px;text-align:center;font:500 12.5px 'Geist Mono',monospace;color:#0B0D14}
/* index view */
.ix{position:relative;padding:150px 0 140px;min-height:100vh}
.ix-h h1{margin:22px 0 0;font-size:clamp(56px,9vw,150px);line-height:.9;letter-spacing:-.055em;font-weight:500;color:#0B0D14}
.ix-h h1 .it{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#2638FF;font-size:1.06em}
.ix-f{display:flex;flex-wrap:wrap;gap:6px 22px;margin:clamp(32px,4vw,56px) 0 18px}
.ix-fb{position:relative;padding:4px 0;border:0;background:none;font:500 clamp(18px,1.6vw,24px) 'Geist',sans-serif;letter-spacing:-.02em;color:#A0A6B6;cursor:pointer;transition:color .25s}
.ix-fb sup{margin-left:4px;font:500 11px 'Geist Mono',monospace;color:inherit}
.ix-fb:hover{color:#0B0D14}
.ix-fb[aria-pressed="true"]{color:#0B0D14}

.gx-toc span{display:flex;align-items:center;gap:10px;font-size:16px;color:#3A3F4F}
.gx-toc b,.gx-ch b{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#EEF1FF;color:#2638FF;font:600 13px 'Geist Mono',monospace}
.gx-ch{display:flex;align-items:center;gap:14px;margin:10px 0 -30px}
.gx-ch span{font-size:26px;font-weight:500;letter-spacing:-.03em;color:#0B0D14}
.gx-ch i{flex:1;height:1px;background:#E3E7F0}
.gx-ch em{font:500 12px 'Geist Mono',monospace;font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:#9AA0B0}
.gx-ch b{background:#0B0D14;color:#FFF}
/* instagram phones */
.igs{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;padding:46px 40px;border-radius:26px;background:radial-gradient(80% 90% at 50% 0%,#FCE7F3 0%,#EEF1FF 55%,#F5F7FB 100%)}
.ig{margin:0;display:flex;flex-direction:column;align-items:center}
.ig-ph{width:100%;max-width:360px;padding:12px 10px 16px;border-radius:38px;background:#FFF;box-shadow:0 0 0 8px #0B0D14,0 0 0 9px #2A2E3B,0 40px 70px -30px rgba(11,13,20,.55)}
.ig-top{display:flex;align-items:center;gap:10px;padding:8px 6px 10px}
.ig-av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#0B0D14;color:#FFF;font:600 10px 'Geist',sans-serif;box-shadow:0 0 0 2px #FFF,0 0 0 4px #E1306C}
.ig-nm{display:flex;flex-direction:column;line-height:1.2}
.ig-nm b{font-size:13px;font-weight:600;color:#0B0D14}
.ig-nm small{font-size:11px;color:#7A8094}
.ig-more{margin-left:auto;color:#0B0D14;font-size:12px;letter-spacing:1px}
.ig-vp{position:relative;overflow:hidden;background:#F1F3F8}
.ig-tr{display:flex;height:100%;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.ig-s{flex:0 0 100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.ig-s img{display:block;width:100%;height:100%;object-fit:cover}
.ig-cnt{position:absolute;right:10px;top:10px;padding:4px 9px;border-radius:99px;background:rgba(11,13,20,.7);color:#FFF;font:500 11px 'Geist',sans-serif}
.ig-a{position:absolute;top:50%;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-top:-15px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#0B0D14;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,scale .2s}
.ig-al{left:10px}.ig-ar{right:10px}
.ig-ph:hover .ig-a{opacity:1}.ig-a:active{scale:.9}
.ig-act{display:flex;align-items:center;gap:14px;padding:12px 6px 6px;font-size:17px;color:#0B0D14}
.ig-dots{display:flex;gap:4px;margin:0 auto}
.ig-dots i{width:6px;height:6px;border-radius:50%;background:#CDD2DE;transition:background .3s,transform .3s}
.ig-dots i.on{background:#2638FF;transform:scale(1.2)}
.ig-sv{margin-left:0}
.ig-cap{margin:4px 6px 0;font-size:12.5px;line-height:1.45;color:#3A3F4F}
.ig-cap b{color:#0B0D14}
.ig figcaption{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:26px;text-align:center}
.ig figcaption b{font-size:18px;font-weight:500;letter-spacing:-.02em;color:#0B0D14}
.ig figcaption span{font:500 11.5px 'Geist Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:#7A8094}
/* poster wall */
.pw{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;align-items:start}
.pw-c{display:block;padding:0;border:0;background:none;text-align:left;font:inherit;cursor:zoom-in}
.pw-c:first-child{grid-row:span 2}
.pw-f{display:block;overflow:hidden;border-radius:12px;background:#EEF1F7;box-shadow:0 0 0 1px rgba(11,13,20,.06),0 24px 40px -28px rgba(11,13,20,.5);transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s}
.pw-f img{display:block;width:100%;height:auto}
.pw-c:hover .pw-f{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 0 0 1px rgba(38,56,255,.2),0 34px 50px -26px rgba(11,13,20,.55)}
.pp .cv-mas{margin-top:0}
html[data-theme="dark"] .gx-top{border-color:rgba(255,255,255,.08)}
html[data-theme="dark"] .gx-top h2,html[data-theme="dark"] .gx-ch span,html[data-theme="dark"] .ig figcaption b{color:#F3F5FA}
html[data-theme="dark"] .gx-top h2 .it,html[data-theme="dark"] .gx-k{color:#7D93FF}
html[data-theme="dark"] .gx-toc span{color:#C9CEDB}
html[data-theme="dark"] .gx-toc b{background:rgba(125,147,255,.15);color:#9DB0FF}
html[data-theme="dark"] .gx-ch b{background:#FFF;color:#07080D}
html[data-theme="dark"] .gx-ch i{background:rgba(255,255,255,.1)}
html[data-theme="dark"] .igs{background:radial-gradient(80% 90% at 50% 0%,#2A1630 0%,#151A33 55%,#0D0F17 100%)}
html[data-theme="dark"] .ig-ph{box-shadow:0 0 0 8px #2A2E3B,0 0 0 9px #3A3F52,0 40px 70px -30px rgba(0,0,0,.9)}
html[data-theme="dark"] .pw-f{box-shadow:0 0 0 1px rgba(255,255,255,.06)}

/* ===== v46 graphic collage + mockups + viewers ===== */
.gc{display:grid;grid-template-columns:repeat(4,299px);grid-auto-rows:10px;column-gap:28px;grid-auto-flow:row dense}
.gt{display:flex;flex-direction:column;padding:0 0 28px;border:0;background:none;text-align:left;font:inherit;color:#0B0D14;cursor:zoom-in;position:relative}
.gt-m{position:relative;display:block;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#EEF1F7;transition:transform .55s cubic-bezier(.22,1,.36,1),box-shadow .55s}
.gt:hover .gt-m{transform:translateY(-5px);box-shadow:0 0 0 calc(1.6px / var(--z)) #2638FF,0 34px 50px -30px rgba(20,35,110,.5)}
.gt-m>img{display:block;width:100%;height:100%;object-fit:cover;transition:scale .9s cubic-bezier(.16,1,.3,1)}
.gt:hover .gt-m>img{scale:1.03}
.gt-cap{display:flex;flex-direction:column;gap:5px;padding:13px 2px 0;height:66px;box-sizing:border-box}
.gt-cap b{font-size:18px;font-weight:500;letter-spacing:-.015em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-cap span{font:500 11.5px 'Geist Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:#7A8094;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-read{position:absolute;right:14px;bottom:14px;z-index:3;padding:7px 13px;border-radius:99px;background:#0B0D14;color:#FFF;font:500 12.5px 'Geist',sans-serif;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .35s cubic-bezier(.22,1,.36,1)}
.gt:hover .gt-read{opacity:1;transform:none}
/* micron cycling stage */
.gt-m-mic{background:radial-gradient(100% 70% at 50% 100%,color-mix(in srgb,var(--gl,#39E36B) 35%,#07080D),#07080D 70%);transition:background .8s}
.gt-mic{position:absolute;inset:0;--gl:#39E36B}
.gt-m-mic{--gl:inherit}
.gt-mic img{position:absolute;left:50%;top:46%;width:62%;transform:translate(-50%,-50%) scale(.96);border-radius:6px;opacity:0;transition:opacity .7s,transform .9s cubic-bezier(.22,1,.36,1);box-shadow:0 30px 40px -18px rgba(0,0,0,.9),0 0 50px -10px var(--gl)}
.gt-mic img.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.gt-chip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#FFF;font:500 11.5px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.gt-count{position:absolute;left:14px;top:14px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.12);color:#FFF;font:500 11px 'Geist Mono',monospace}
/* social cycling */
.gt-soc{position:absolute;inset:0}
.gt-soc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.gt-soc img.on{opacity:1}
.gt-car{position:absolute;right:12px;top:12px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.gt-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:5px}
.gt-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:background .3s,transform .3s}
.gt-dots i.on{background:#FFF;transform:scale(1.25)}
/* open book / magazine mockup */
.gt-m-book{background:radial-gradient(90% 90% at 50% 40%,#FFF6E6,#F3DDB7)}
.gt-m-mag{background:radial-gradient(90% 90% at 50% 40%,#E9EFEA,#C9D6CE)}
.gt-open{position:absolute;left:9%;right:9%;top:12%;bottom:13%}
.gt-spr{position:absolute;inset:0;display:flex;opacity:0;transition:opacity .9s}
.gt-spr.on{opacity:1}
.gt-pg{position:relative;flex:1;overflow:hidden;background:#FFF}
.gt-pg img{display:block;width:100%;height:100%;object-fit:cover}
.gt-book .gt-pl{border-radius:4px 0 0 4px}.gt-book .gt-pr{border-radius:0 4px 4px 0}
.gt-book::before{content:"";position:absolute;inset:-10px -12px -12px;border-radius:10px;background:linear-gradient(#8B2E1A,#6E2010);box-shadow:0 30px 40px -20px rgba(70,20,0,.7)}
.gt-book .gt-spr{box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.gt-mag .gt-spr{filter:drop-shadow(0 26px 22px rgba(15,40,25,.45))}
.gt-mag .gt-pl{transform:perspective(900px) rotateY(6deg);transform-origin:right center}
.gt-mag .gt-pr{transform:perspective(900px) rotateY(-6deg);transform-origin:left center}
.gt-pl::after,.gt-pr::after{content:"";position:absolute;inset:0;pointer-events:none}
.gt-pl::after{background:linear-gradient(90deg,transparent 70%,rgba(0,0,0,.18) 96%,rgba(0,0,0,.32))}
.gt-pr::after{background:linear-gradient(270deg,transparent 70%,rgba(0,0,0,.14) 96%,rgba(0,0,0,.28))}
.gt-gutter{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(0,0,0,.25);z-index:2}
.gt:hover .gt-open{transform:scale(1.02);transition:transform .6s cubic-bezier(.22,1,.36,1)}
/* closed book mockup */
.gt-m-cb{background:radial-gradient(90% 80% at 50% 30%,#EEF6FF,#D7E4F5)}
.gt-cb{position:absolute;left:18%;right:18%;top:10%;bottom:11%;perspective:1200px}
.gt-cbk{position:absolute;inset:0;transform-origin:left center;transform:rotateY(-14deg);transition:transform .7s cubic-bezier(.22,1,.36,1);box-shadow:18px 26px 30px -14px rgba(10,30,60,.5);border-radius:2px 6px 6px 2px;overflow:hidden;z-index:2}
.gt-cbk img{display:block;width:100%;height:100%;object-fit:cover}
.gt-spine{position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.18) 40%,rgba(0,0,0,.1))}
.gt-pages{position:absolute;left:4%;right:-3%;top:2%;bottom:-2%;border-radius:2px 5px 5px 2px;background:repeating-linear-gradient(90deg,#FFF 0 2px,#E8E8E8 2px 3px);transform:rotateY(-14deg);transform-origin:left center;z-index:1;box-shadow:0 20px 30px -16px rgba(10,30,60,.5)}
.gt:hover .gt-cbk{transform:rotateY(-32deg)}
/* billboard */
.gt-m-bill{background:linear-gradient(#DCE3EE,#C6CFDD)}
.gt-bill{position:absolute;left:4%;right:4%;top:12%;bottom:18%;background:#FFF;border-radius:6px;box-shadow:0 0 0 6px #2A2E3B,0 30px 40px -20px rgba(0,0,0,.5);overflow:hidden}
.gt-bill img{width:100%;height:100%;object-fit:cover}
.gt-tag{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font:500 12px 'Geist Mono',monospace;color:#4A5062}
/* project viewer */
.pv{position:fixed;inset:0;z-index:260;font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column;background:rgba(8,9,14,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;transition:opacity .35s;color:#FFF}
.pv.on{opacity:1}
.pv-h{display:flex;align-items:center;gap:16px;padding:20px 26px}
.pv-h>div{display:flex;flex-direction:column;gap:4px}
.pv-h b{font-size:20px;font-weight:500;letter-spacing:-.02em}
.pv-h span{font:500 11.5px 'Geist Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:#A4ABBE}
.pv-c{margin-left:auto;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.1);font:500 12.5px 'Geist Mono',monospace!important;color:#FFF!important;text-transform:none!important}
.pv-x,.pv-b{display:inline-flex;align-items:center;justify-content:center;flex:none;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#FFF;cursor:pointer;transition:background .25s,scale .2s}
.pv-x:hover,.pv-b:hover{background:rgba(255,255,255,.22)}.pv-b:active,.pv-x:active{scale:.92}
.pv-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:2600px;padding:0 20px}
.pv-f{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 20px 24px}
.pv-th{display:flex;gap:8px;max-width:min(900px,70vw);overflow-x:auto;scrollbar-width:none;padding:4px}
.pv-th::-webkit-scrollbar{display:none}
.pv-th button{flex:none;width:52px;height:64px;padding:0;border:0;border-radius:8px;overflow:hidden;background:#222;cursor:pointer;opacity:.5;outline:2px solid transparent;transition:opacity .25s,outline-color .25s}
.pv-th button.on{opacity:1;outline-color:#FFF}
.pv-th img{width:100%;height:100%;object-fit:cover}
.pv-rng{width:min(520px,60vw);accent-color:#FFF}
/* flipbook */
.fb{position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.65,0,.35,1);cursor:pointer}
.fb-board{position:absolute;inset:-12px;border-radius:12px;background:linear-gradient(135deg,#7A2614,#4E140A);box-shadow:0 50px 80px -30px rgba(0,0,0,.9);opacity:0;transition:opacity .6s}
.pv-hard .fb.open .fb-board{opacity:1}
.pv-mag .fb-board,.pv-book:not(.pv-hard) .fb-board{inset:0;background:none;box-shadow:0 50px 80px -30px rgba(0,0,0,.9)}
.pv-mag .fb.open .fb-board,.pv-book:not(.pv-hard) .fb.open .fb-board{opacity:1}
.lf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-style:preserve-3d;transform-origin:left center;transition:transform .95s cubic-bezier(.45,.05,.25,1)}
.lf.flip{transform:rotateY(-180deg)}
.lf.peek:not(.flip){transform:rotateY(-14deg)}
.lf.peekb.flip{transform:rotateY(-166deg)}
.lf-f,.lf-b{position:absolute;inset:0;overflow:hidden;background:#FFF;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.lf-b{transform:rotateY(180deg)}
.lf-f{border-radius:0 4px 4px 0}.lf-b{border-radius:4px 0 0 4px}
.lf img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.lf-sh{position:absolute;inset:0;pointer-events:none}
.lf-f .lf-sh{background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 12%)}
.lf-b .lf-sh{background:linear-gradient(270deg,rgba(0,0,0,.22),rgba(0,0,0,0) 12%)}
.pv-mag .lf-f .lf-sh{background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.08) 6%,rgba(0,0,0,0) 22%)}
.pv-mag .lf-b .lf-sh{background:linear-gradient(270deg,rgba(0,0,0,.3),rgba(255,255,255,.08) 6%,rgba(0,0,0,0) 22%)}
.lf-hd .lf-f,.lf-hd .lf-b{box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.pv-hard .lf-hd .lf-f{border-radius:2px 8px 8px 2px}
.fb:not(.open) .lf:first-child .lf-f{box-shadow:20px 30px 50px -20px rgba(0,0,0,.8)}
/* gallery */
.pv-duo{display:flex;gap:34px;align-items:center;justify-content:center;height:100%;max-height:calc(100vh - 260px)}
.pv-duo figure{margin:0;height:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.pv-duo img{height:calc(100% - 30px);width:auto;border-radius:8px;box-shadow:0 30px 60px -24px rgba(0,0,0,.9),0 0 80px -20px var(--g);animation:pvin .5s cubic-bezier(.22,1,.36,1)}
.pv-duo figcaption{font:500 11.5px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A4ABBE}
.pv-nm{margin:10px 0 0;font-size:22px;font-weight:500;letter-spacing:-.02em}
.pv-one{height:100%;max-height:calc(100vh - 230px);aspect-ratio:1/var(--r);max-width:calc(100vw - 40px);display:flex;align-items:center;justify-content:center}
.pv-one img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 40px 80px -30px rgba(0,0,0,.9);animation:pvin .45s cubic-bezier(.22,1,.36,1)}
@keyframes pvin{from{opacity:0;transform:translateY(10px) scale(.98)}}
@media (max-width:760px){.pv-h{padding:14px 16px}.pv-h b{font-size:16px}.pv-duo{gap:12px}.pv-th button{width:40px;height:50px}.pv-b{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.lf,.fb{transition:none}}
html[data-theme="dark"] .gt{color:#F3F5FA}
html[data-theme="dark"] .gt-cap span{color:#8B92A7}
html[data-theme="dark"] .gt-m{background:#181B27}
html[data-theme="dark"] .gt-read{background:#FFF;color:#07080D}
html[data-theme="dark"] .gt-m-book{background:radial-gradient(90% 90% at 50% 40%,#3A2C18,#1F170C)}
html[data-theme="dark"] .gt-m-mag{background:radial-gradient(90% 90% at 50% 40%,#1F3328,#101C16)}
html[data-theme="dark"] .gt-m-cb{background:radial-gradient(90% 80% at 50% 30%,#1D2638,#111723)}
html[data-theme="dark"] .gt-m-bill{background:linear-gradient(#232838,#161A26)}
html[data-theme="dark"] .gt-tag{color:#A4ABBE}

/* v47 figma selection on graphic tiles */
.gt-mw{position:relative;display:block;flex:1;min-height:0}
.gt-mw>.gt-m{height:100%}
.gt:hover .gt-m{box-shadow:0 34px 50px -30px rgba(20,35,110,.5)!important;transform:none}
.gt:hover .cv-sel,.gt:focus-visible .cv-sel{opacity:1}
.gt:hover .cv-sel{border-color:#2638FF!important}.gt:hover .cv-sel b{border-color:#2638FF!important}.gt:hover .cv-sel em{background:#2638FF!important}
.gt.pc-sel .cv-sel{opacity:1;border-color:#FF5A36}.gt.pc-sel .cv-sel b{border-color:#FF5A36}.gt.pc-sel .cv-sel em{background:#FF5A36}
.gt .cv-sel{z-index:4}
.gt:focus-visible{outline:none}

/* v49 print fidelity: never crop pages */
.gt-open{right:auto;bottom:auto}
.gt-pg{background:#FFF}
.gt-pg img,.gt-cbk img{object-fit:contain;background:#FFF}
.lf img{object-fit:contain;background:#FFF}
.gt-cb{right:auto;bottom:auto}
.gt-soft::before{display:none}
.gt-soft .gt-spr{filter:drop-shadow(0 22px 20px rgba(70,40,0,.35))}
.gt-m-mag:has(.gt-one){background:radial-gradient(90% 90% at 50% 40%,#FBF7F4,#E9DFD6)}
.gt-one .gt-spr{filter:drop-shadow(0 22px 22px rgba(40,25,15,.4))}
.gt-one::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;background:repeating-linear-gradient(90deg,#FFF 0 2px,#E4E0DB 2px 3px);border-radius:0 0 3px 3px;transform:perspective(600px) rotateX(30deg);transform-origin:top;opacity:.9}
/* encyclopedia */
.gt-m-ency{background:radial-gradient(95% 90% at 50% 35%,#F6EEE2,#E2D3BE)}
.gt-enc{position:absolute;transform:perspective(1400px) rotateX(10deg);transform-origin:50% 100%}
.gt-enc-cov{position:absolute;inset:-5% -3.2% -8.5%;border-radius:6px;background:linear-gradient(180deg,#244534,#16301F);box-shadow:inset 0 0 0 2px rgba(214,178,94,.55),inset 0 0 0 5px #1B3626,inset 0 0 0 6px rgba(214,178,94,.35),0 34px 40px -22px rgba(40,25,5,.75)}
.gt-enc-stk{position:absolute;left:1%;right:1%;bottom:-5.5%;height:5.5%;background:repeating-linear-gradient(0deg,#FBF8F1 0 1px,#DCD4C4 1px 2px);border-radius:0 0 4px 4px;box-shadow:0 2px 0 #CFC5B2}
.gt-enc .gt-pg{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.gt-enc .gt-pl{left:0;border-radius:3px 0 0 3px;transform:perspective(1100px) rotateY(5deg);transform-origin:right center}
.gt-enc .gt-pr{right:0;border-radius:0 3px 3px 0;transform:perspective(1100px) rotateY(-5deg);transform-origin:left center}
.gt-enc .gt-pg img{position:absolute;top:0;height:100%;width:200%;max-width:none;object-fit:fill}
.gt-enc .gt-pl img{left:0}.gt-enc .gt-pr img{left:-100%}
.gt-enc .gt-pl::after{background:linear-gradient(90deg,transparent 78%,rgba(0,0,0,.25) 97%,rgba(0,0,0,.45))}
.gt-enc .gt-pr::after{background:linear-gradient(270deg,transparent 78%,rgba(0,0,0,.2) 97%,rgba(0,0,0,.4))}
.gt-enc .gt-gutter{background:rgba(0,0,0,.5)}

/* Detail Craft board on a light wall */
.gt-m-board{background:#ECEEF2}
.bd{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#F5F6F8 0%,#E9EBF0 72%,#DCDFE6 72.4%,#E4E6EB 100%)}
.bd::before{content:"";position:absolute;inset:0 0 28% 0;background:repeating-linear-gradient(0deg,rgba(11,13,20,.025) 0 1px,transparent 1px 22px);pointer-events:none}
.bd-light{position:absolute;left:10%;right:10%;top:0;height:60%;background:radial-gradient(60% 70% at 50% 0%,rgba(255,255,255,.95),transparent 70%)}
.bd-b{position:absolute;left:8%;right:8%;top:20%;aspect-ratio:120/36;background:#FFF;border-radius:3px;box-shadow:0 0 0 1px rgba(11,13,20,.1),0 2px 0 rgba(11,13,20,.06),0 26px 30px -18px rgba(20,30,60,.45);overflow:visible}
.bd-b img{display:block;width:100%;height:100%;object-fit:contain;border-radius:3px}
.bd-bolt{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF,#B9BEC9 60%,#8D93A0);box-shadow:0 1px 1px rgba(0,0,0,.25)}

.bd-dim{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font:500 11.5px 'Geist Mono',monospace;letter-spacing:.06em;color:#7A8094}
.gt:hover .bd-b{transform:translateY(-3px);transition:transform .5s cubic-bezier(.22,1,.36,1)}
