<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
a:hover{opacity:.8}
a:focus-visible,button:focus-visible{outline:2px solid #2D5BFF;outline-offset:3px;border-radius:6px}
.arrive{position:fixed;inset:0;z-index:300;background:#000;display:flex;align-items:center;justify-content:center;animation:lift 1s cubic-bezier(.76,0,.24,1) .4s forwards;pointer-events:none}
.arrive-mark{width:14px;height:14px;background:#FFF;box-shadow:14px 0 #FFF,28px 0 #FFF,0 14px #FFF,42px 14px #FFF,0 28px #FFF,42px 28px #FFF,0 42px #FFF,14px 42px #FFF,28px 42px #FFF,0 56px #FFF,0 70px #FFF;transform:translate(-21px,-35px)}
@keyframes lift{to{transform:translateY(-100%)}}
@media (prefers-reduced-motion:reduce){.arrive{display:none}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
.meta-row{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid #EAECF2}
.h-hero{font-size:clamp(56px,10.4vw,210px);line-height:.92;letter-spacing:-.055em;font-weight:400}
.h-cta{font-size:clamp(64px,10vw,190px);line-height:.92;letter-spacing:-.055em;font-weight:400}
.hero-info{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:32px;margin-top:clamp(32px,3.4vw,64px);padding-top:18px;border-top:1px solid #EAECF2;align-items:start}
.hdr{transition:background .35s,border-color .35s,backdrop-filter .35s;border-bottom:1px solid transparent}
.hdr.scrolled{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:#EAECF2}
.ul{position:relative}.ul::after{content:"";position:absolute;left:0;bottom:-3px;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.7,0,.2,1)}.ul:hover::after{transform:scaleX(1);transform-origin:left}
.fl{display:block;font-size:clamp(16px,1.2vw,20px);line-height:1.8;color:#FFFFFF}
.wordmark{font-size:clamp(56px,13.2vw,280px);line-height:.85;letter-spacing:-.06em;font-weight:500;white-space:nowrap;margin:clamp(56px,6vw,120px) 0 22px;color:#FFFFFF}
.fade-in{animation:fadein 1.2s ease .4s both}@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:820px){.hero-info{grid-template-columns:1fr}.hero-info>div{justify-content:flex-start !important}.h-hero .ln{padding-left:0 !important}}
