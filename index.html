<body>
<template id="dc-tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
html{scroll-behavior:auto}
a{color:#000;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #2D5BFF;outline-offset:3px}
::selection{background:#2D5BFF;color:#FFFFFF}
img,video{display:block;max-width:100%}
/* preloader */
.pre{position:fixed;inset:0;z-index:300;background:#000;color:#FFF;display:flex;align-items:center;justify-content:center;transition:transform 1s cubic-bezier(.76,0,.24,1)}
.pre.done{transform:translateY(-100%)}
.pre.gone{display:none}
.px{display:grid;grid-template-columns:repeat(4,22px);grid-auto-rows:22px}
.px i{background:#FFF;opacity:0;animation:pxin .5s steps(1) forwards}
@keyframes pxin{to{opacity:1}}
.pre .cnt{position:absolute;left:clamp(20px,3.4vw,48px);bottom:12px;font:300 clamp(64px,10vw,150px)/1 'Geist',sans-serif;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.pre .lbl{position:absolute;right:clamp(20px,3.4vw,48px);bottom:28px;font:500 12px 'Geist',sans-serif;letter-spacing:.2em}
.veil{position:fixed;inset:0;z-index:290;background:#000;transform:translateY(100%);transition:transform .55s cubic-bezier(.76,0,.24,1);display:flex;align-items:center;justify-content:center;pointer-events:none}
.veil.on{transform:none}
/* pills */
.pill{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 20px;border-radius:999px;font:500 13px 'Geist',sans-serif;letter-spacing:.06em;text-transform:uppercase;border:0;cursor:pointer;transition:background .3s,color .3s,transform .5s cubic-bezier(.16,1,.3,1)}
.pill-dark{background:#151A2B;color:#FFF}.pill-dark:hover{background:#2D5BFF;color:#FFF}
.pill-light{background:#EEF1F8;color:#000}.pill-light:hover{background:#E3E7F0}
.pill-white{background:#FFF;color:#000;box-shadow:inset 0 0 0 1px #E3E7F0}.pill-white:hover{background:#151A2B;color:#FFF}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.mi{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:20px;text-transform:uppercase;transition:color .25s,padding .35s}
.mi:hover{color:#2D5BFF;padding-left:6px}
/* reveal */
.ln{display:block;overflow:hidden;padding-bottom:.08em}
.ln>span{display:inline-block;transform:translateY(105%);transition:transform 1.3s cubic-bezier(.16,1,.3,1)}
.in .ln>span{transform:none}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s ease,transform 1.2s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
/* work: see below */


.reel .pb{transition:transform .5s cubic-bezier(.16,1,.3,1)}
.reel:hover .pb{transform:scale(1.12)}
/* strip */
.strip{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;cursor:grab;padding:0 clamp(20px,3.4vw,48px) 8px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip.drag{cursor:grabbing;scroll-snap-type:none}
.tile{flex:0 0 auto;scroll-snap-align:start}
.tile .tf{position:relative;overflow:hidden;border-radius:12px;background:#0B0D14}
.tile .tf img,.tile .tf video{width:100%;height:100%;object-fit:cover;transition:scale 1s cubic-bezier(.16,1,.3,1);pointer-events:none}
.tile:hover .tf img,.tile:hover .tf video{scale:1.05}
.acc{transition:background .3s}.acc:hover{background:#F7F7F9}
.cl{transition:color .25s}.cl:hover{color:#2D5BFF}
.sbar{position:fixed;right:10px;top:50%;width:3px;height:80px;margin-top:-40px;border-radius:3px;background:#D5D7E6;z-index:70;overflow:hidden}
.sbar i{position:absolute;left:0;right:0;top:0;height:22px;background:#000;border-radius:3px}
.sm-only{display:none !important}
.gl-on .fb{opacity:0}
.gl-on .reel{background:transparent}

.w{opacity:.14;transition:opacity .2s linear}
.dev{transform-style:preserve-3d;will-change:transform;transition:transform .25s ease-out}
@media (prefers-reduced-motion:reduce){.w{opacity:1}}
.h-xl{font-size:clamp(48px,7.6vw,150px);line-height:.98;letter-spacing:-.035em;font-weight:400}
.h-lg{font-size:clamp(44px,5.6vw,108px);line-height:1;letter-spacing:-.035em;font-weight:400}
.p-md{font-size:clamp(16px,1.45vw,28px);line-height:1.42;letter-spacing:-.005em}
.xrow{display:flex;justify-content:space-between;align-items:center;height:clamp(44px,3.4vw,64px);font-size:clamp(20px,1.5vw,28px);font-weight:300}
.xlbl{font-size:clamp(11px,.75vw,14px);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.ico{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#EEF1F8;color:#000;transition:background .3s}.ico:hover{background:#FFF}
.reel{display:block;position:relative;border-radius:24px;overflow:hidden;aspect-ratio:2.96/1;min-height:300px;background:#0B0D14;color:#FFF}
.rtxt{font-size:clamp(56px,7.4vw,142px);letter-spacing:-.02em;line-height:1}
.rpb{display:inline-flex;align-items:center;justify-content:center;width:clamp(96px,9.4vw,180px);height:clamp(60px,6vw,116px);border-radius:999px;background:#FFF;opacity:var(--pbo,1);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.rw{display:inline-flex;overflow:hidden;padding:.06em 0}
.rl{display:inline-block;transform:translateY(105%);transition:transform .7s cubic-bezier(.16,1,.3,1)}
.rtxt.on .rl{transform:none}
.reel:hover .rpb{transform:scale(1.08)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:2vw;row-gap:clamp(48px,4.4vw,96px)}
.wk{display:block;color:#000}
.wk .frame{position:relative;overflow:hidden;border-radius:20px;aspect-ratio:3/2;background:#F5F7FB}
.wk .im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:scale 1.2s cubic-bezier(.16,1,.3,1),opacity .3s}
.wk:hover .im{scale:1.05}
.wk .im.glr{opacity:0}
.wk .frame:has(.glr){background:transparent}
.wk .tags{margin:16px 0 0;font-size:clamp(10px,.6vw,12px);font-weight:500;letter-spacing:.03em;text-transform:uppercase}
.wk .ttl{display:flex;align-items:center;margin:6px 0 0;font-size:clamp(22px,1.9vw,36px);font-weight:400;letter-spacing:-.02em}
.wk .ar{display:inline-block;width:0;opacity:0;overflow:hidden;transition:width .45s cubic-bezier(.16,1,.3,1),opacity .3s}
.wk:hover .ar{width:1.4em;opacity:1}
.pill{height:48px;padding:0 24px;font-size:14px}

@media (max-width:820px){.st-copy{margin-left:0 !important;width:100% !important}.st-card{width:100% !important;margin-top:48px !important}.reel{aspect-ratio:16/9}}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}.lg-only{display:none !important}.sm-only{display:inline-flex !important}.sbar{display:none}}
@media (prefers-reduced-motion:reduce){.ln>span{transform:none;transition:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
.meta-row{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid #EAECF2}
.h-hero{font-size:clamp(56px,10.4vw,210px);line-height:.92;letter-spacing:-.055em;font-weight:400}
.h-cta{font-size:clamp(64px,10vw,190px);line-height:.92;letter-spacing:-.055em;font-weight:400}
.hero-info{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:32px;margin-top:clamp(32px,3.4vw,64px);padding-top:18px;border-top:1px solid #EAECF2;align-items:start}
.hdr{transition:background .35s,border-color .35s,backdrop-filter .35s;border-bottom:1px solid transparent}
.hdr.scrolled{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:#EAECF2}
.ul{position:relative}.ul::after{content:"";position:absolute;left:0;bottom:-3px;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.7,0,.2,1)}.ul:hover::after{transform:scaleX(1);transform-origin:left}
.fl{display:block;font-size:clamp(16px,1.2vw,20px);line-height:1.8;color:#FFFFFF}
.wordmark{font-size:clamp(56px,13.2vw,280px);line-height:.85;letter-spacing:-.06em;font-weight:500;white-space:nowrap;margin:clamp(56px,6vw,120px) 0 22px;color:#FFFFFF}
.fade-in{animation:fadein 1.2s ease .4s both}@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:820px){.hero-info{grid-template-columns:1fr}.hero-info>div{justify-content:flex-start !important}.h-hero .ln{padding-left:0 !important}}
.pill-blue{background:#2D5BFF;color:#FFF}.pill-blue:hover{background:#1E3FE0;color:#FFF}
h1,h2,h3{text-wrap:balance}
.rv{filter:blur(6px);transform:translateY(28px)}.rv.in{filter:none}
.rv{transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.3s cubic-bezier(.22,1,.36,1),filter 1.1s cubic-bezier(.22,1,.36,1)}
.ln>span{transition:transform 1.4s cubic-bezier(.22,1,.36,1)}
.pill{transition:background .35s cubic-bezier(.22,1,.36,1),color .35s,transform .6s cubic-bezier(.22,1,.36,1),box-shadow .35s}
.pill-dark:hover,.pill-blue:hover{box-shadow:0 10px 30px rgba(45,91,255,.28)}
::selection{background:#2D5BFF;color:#FFF}
.navpill{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 8px;border-radius:999px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid #E3E7F0;box-shadow:0 10px 40px rgba(11,13,20,.07),0 1px 2px rgba(11,13,20,.04)}
.brand{display:flex;align-items:center;gap:10px;padding:0 14px 0 0;height:44px}
.mark{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#2D5BFF;color:#FFF;font-weight:600;font-size:16px;letter-spacing:-.02em;box-shadow:inset 0 -6px 12px rgba(0,0,0,.12)}
.brand-txt{font-size:15px;font-weight:500;letter-spacing:-.01em}
.navlinks{display:flex;gap:2px;padding:0 6px;border-left:1px solid #E3E7F0;margin-left:2px}
.nl{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:999px;font-size:14px;color:#151A2B;transition:background .3s cubic-bezier(.22,1,.36,1),color .3s}
.nl:hover{background:#EEF1F8}
.nl.act{background:#0B0D14;color:#FFF}
.hdr{transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s;border:0 !important;background:transparent !important;backdrop-filter:none !important}
.hdr.hide{transform:translateY(-120%);opacity:0}
.mmenu{position:absolute;top:64px;left:16px;right:16px;background:#FFF;border:1px solid #E3E7F0;border-radius:24px;padding:12px 22px 22px;box-shadow:0 20px 60px rgba(11,13,20,.12);display:flex;flex-direction:column}
.chip{position:absolute;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:#FFF;border:1px solid #E3E7F0;box-shadow:0 10px 30px rgba(11,13,20,.07);font-size:14px;white-space:nowrap;animation:floaty 6s ease-in-out infinite;will-change:transform}
.chip i{width:8px;height:8px;border-radius:50%;background:#2D5BFF;display:inline-block}
@keyframes floaty{50%{translate:0 -10px}}
.bands{position:relative;height:clamp(150px,14vw,240px);margin:clamp(40px,4vw,80px) calc(-1 * clamp(20px,6vw,140px)) 0;overflow:hidden}
.band{position:absolute;left:-5%;right:-5%;top:50%;display:flex;white-space:nowrap;padding:18px 0;font-size:clamp(22px,2.2vw,40px);letter-spacing:-.02em}
.band .tr{display:flex;width:max-content;animation:marq 38s linear infinite}
.band-a{background:#2D5BFF;color:#FFF;transform:translateY(-50%) rotate(-2.2deg);z-index:2;box-shadow:0 20px 50px rgba(45,91,255,.25)}
.band-b{background:#E8EEFF;color:#1E3FE0;transform:translateY(-50%) rotate(2deg)}
.band-b .tr{animation-direction:reverse;animation-duration:46s}
.band span.s{display:inline-flex;align-items:center;gap:28px;padding-right:28px}
.band span.s::after{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.6}
@keyframes marq{to{transform:translateX(-50%)}}
.stat b{display:block;font-size:clamp(36px,3.4vw,64px);font-weight:400;letter-spacing:-.04em;line-height:1}
.stat span{display:block;margin-top:6px}
.worksec{margin:0 clamp(8px,1.4vw,24px);border-radius:40px;background:#F5F7FB}
@media (max-width:820px){.navpill{width:100%;justify-content:space-between}.chip{display:none}}
@media (prefers-reduced-motion:reduce){.chip,.band .tr{animation:none}}

/* ===== v3 design pass ===== */
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.it{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.015em}
.h-hero .it,.h-xl .it,.h-lg .it,.h-cta .it,#ph-h .it{font-size:1.07em;line-height:.8}
.eyebrow{display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 14px 0 5px;border-radius:999px;background:#FFF;border:1px solid #E3E7F0;font:500 11.5px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;color:#2A2F3F;box-shadow:0 1px 2px rgba(11,13,20,.04)}
.eyebrow b{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:#E8EEFF;color:#1E3FE0;font-weight:500;font-size:10.5px}
.aura{position:absolute;left:0;right:0;top:0;height:min(1100px,130vh);pointer-events:none;z-index:0;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;animation:drift 20s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate3d(5%,7%,0) scale(1.1)}}
.dotgrid{position:absolute;left:0;right:0;top:0;height:900px;background-image:radial-gradient(#D3DAEA 1px,transparent 1.2px);background-size:30px 30px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 20%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 20%,#000 0%,transparent 75%);pointer-events:none;z-index:0;opacity:.7}
#top>*:not(.aura):not(.dotgrid){position:relative;z-index:1}
.cap{display:inline-block;vertical-align:middle;width:1.75em;height:.74em;border-radius:999px;overflow:hidden;margin:0 0 0 .14em;position:relative;top:-.07em;background:#2D5BFF;box-shadow:0 24px 50px -12px rgba(45,91,255,.45),inset 0 0 0 1px rgba(255,255,255,.2)}
.cap video{width:100%;height:100%;object-fit:cover}
.pill{text-transform:none;letter-spacing:-.005em;font-size:15px;font-weight:500}
.pill .arc{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-right:-12px;border-radius:50%;background:#FFF;color:#2D5BFF;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.pill .arc.dn svg{transform:rotate(90deg)}
.pill:hover .arc{transform:translateX(3px)}
.pill:hover .arc.dn{transform:translateY(2px)}
.pill-light .arc,.pill-white .arc{background:#0B0D14;color:#FFF}
.pill-white:hover .arc{background:#2D5BFF}
.herocard{border:1px solid #E6EAF2;background:linear-gradient(180deg,#F8FAFE 0%,#EEF2FB 100%) !important;box-shadow:0 40px 100px -40px rgba(30,63,224,.25)}
.tagc{position:absolute;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid #E3E7F0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:500 11.5px/1 'Geist Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:#2A2F3F}
.tagc i{width:7px;height:7px;border-radius:50%;background:#2D5BFF}
/* work cards */
.wk{padding:10px 10px 24px;border-radius:30px;background:#FFF;border:1px solid #E6EAF2;transition:box-shadow .7s cubic-bezier(.22,1,.36,1),border-color .4s}
.wk:hover{box-shadow:0 40px 80px -30px rgba(30,63,224,.28);border-color:#D3DCF7}
.wk .ov{position:absolute;z-index:7;pointer-events:none}
.wk .cat{left:14px;top:14px;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13px;font-weight:500;color:#0B0D14;box-shadow:0 6px 20px rgba(11,13,20,.08)}
.wk .cat i{width:7px;height:7px;border-radius:50%;background:#2D5BFF}
.wk .go{right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#2D5BFF;color:#FFF;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5) rotate(-45deg);transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .35s;box-shadow:0 14px 34px rgba(45,91,255,.4)}
.wk:hover .go{opacity:1;transform:rotate(-45deg)}
.wk .meta{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:22px 14px 0}
.wk .ttl{margin:0;font-size:clamp(24px,2vw,38px);line-height:1.05;letter-spacing:-.03em;transition:color .3s}
.wk:hover .ttl{color:#1E3FE0}
.wk .desc{margin:10px 0 0;color:#5E6372;font-size:clamp(15px,1.05vw,17px);line-height:1.5;max-width:44ch}
.wk .num{flex:none;display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 11px;border-radius:999px;background:#F2F5FB;color:#1E3FE0}
.wk .tags{margin:18px 14px 0;padding-top:16px;border-top:1px solid #EEF1F6;color:#5E6372;font-size:11.5px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(12px,1.2vw,20px)}
.bx{position:relative;border-radius:32px;padding:clamp(26px,2.4vw,42px);background:#F5F7FB;border:1px solid #E9EDF5;overflow:hidden;min-height:clamp(300px,25vw,440px);display:flex;flex-direction:column}
.bx h3{position:relative;margin:0;font-size:clamp(26px,2.2vw,40px);font-weight:400;letter-spacing:-.03em;line-height:1.05}
.bx p{position:relative;margin:14px 0 0;color:#5E6372;font-size:clamp(15px,1.05vw,17px);line-height:1.55;max-width:38ch}
.bx .k{position:relative;margin:0 0 auto;padding-bottom:28px}
.bx-blue{background:radial-gradient(120% 120% at 100% 0%,#5B82FF 0%,#2D5BFF 38%,#1E3FE0 72%,#1733B8 100%);color:#FFF;border:0;box-shadow:0 40px 90px -40px rgba(30,63,224,.6)}
.bx-blue p{color:rgba(255,255,255,.8)}
.bx-blue .eyebrow{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#FFF}
.bx-blue .eyebrow b{background:#FFF;color:#1E3FE0}
.bx-dark{background:#0B0D14;color:#FFF;border:0}
.bx-dark p{color:rgba(255,255,255,.75)}
.bx-dark .eyebrow{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#FFF}
.bx .bgm{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:scale 1.4s cubic-bezier(.22,1,.36,1)}
.bx:hover .bgm{scale:1.05}
.bx .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,20,0) 30%,rgba(11,13,20,.82) 100%)}
.tl{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tl span{display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:999px;background:#FFF;border:1px solid #E3E7F0;font-size:13px;color:#2A2F3F}
.bx-blue .tl span{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#FFF}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:auto;position:relative}
.tool{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:18px;background:#FFF;border:1px solid #E6EAF2;font-size:12.5px;color:#2A2F3F;transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s}
.tool:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(30,63,224,.35)}
.tool b{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;color:#FFF;font-weight:600;font-size:15px;letter-spacing:-.02em}
