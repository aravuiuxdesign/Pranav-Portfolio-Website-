/* ===== page transition v2 ===== */
.pt{position:fixed;inset:0;z-index:320;pointer-events:none;overflow:hidden}
.pt-a,.pt-b{position:absolute;inset:0;transform:translateY(112%);will-change:transform}
.pt-a{background:linear-gradient(135deg,#4F7BFF 0%,#2D5BFF 50%,#5B4BFF 100%)}
.pt-b{background:#0B0D14;display:flex;align-items:center;justify-content:center}
.pt-a::before,.pt-b::before,.pt-a::after,.pt-b::after{content:"";position:absolute;left:-15%;right:-15%;height:22vh;border-radius:50%;background:inherit}
.pt-a::before,.pt-b::before{top:-11vh}
.pt-a::after,.pt-b::after{bottom:-11vh}
.pt-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:26px;color:#FFF;opacity:0;transform:translateY(18px)}
.pt-mark{width:10px;height:10px;background:#FFF;transform:translate(-15px,-25px);box-shadow:10px 0 #FFF,20px 0 #FFF,0 10px #FFF,30px 10px #FFF,0 20px #FFF,30px 20px #FFF,0 30px #FFF,10px 30px #FFF,20px 30px #FFF,0 40px #FFF,0 50px #FFF;margin-bottom:-30px}
.pt-lbl{font-family:'Geist',system-ui,sans-serif;font-size:clamp(28px,3.2vw,54px);font-weight:400;letter-spacing:-.04em;line-height:1;margin-top:26px}
.pt.out{pointer-events:auto}
.pt.out .pt-a{animation:ptIn .8s cubic-bezier(.76,0,.24,1) forwards}
.pt.out .pt-b{animation:ptIn .8s cubic-bezier(.76,0,.24,1) .1s forwards}
.pt.out .pt-in{opacity:1;transform:none;transition:opacity .45s ease .5s,transform .7s cubic-bezier(.22,1,.36,1) .5s}
@keyframes ptIn{from{transform:translateY(112%)}to{transform:translateY(0)}}
.pt.arr .pt-a,.pt.arr .pt-b{transform:translateY(0)}
.pt.arr .pt-in{opacity:1;transform:none;animation:ptFade .4s ease .2s forwards}
.pt.arr .pt-b{animation:ptOut 1s cubic-bezier(.76,0,.24,1) .45s forwards}
.pt.arr .pt-a{animation:ptOut 1s cubic-bezier(.76,0,.24,1) .58s forwards}
@keyframes ptOut{to{transform:translateY(-112%)}}
@keyframes ptFade{to{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.pt{display:none}}

























/* ===== case study v3 (reference hierarchy, light) ===== */
.cs{width:100%;background:#FFF;color:#0B0D14;font-family:'Geist',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}

.lg .mk{width:1.1em;height:1.1em;flex:none}
.lg-nn{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#FF8A1F,#E23B2E);-webkit-background-clip:text;background-clip:text;color:transparent;gap:.02em}

.lg-sp{font-family:'Poppins',sans-serif;font-weight:500;color:#0F172A;letter-spacing:-.02em}.lg-sp b{font-weight:700;color:#2563EB}
.lg-paw{font-family:'Poppins',sans-serif;font-weight:700;color:#2B2118;letter-spacing:-.02em}
.lg-hot{font-family:'Geist',sans-serif;font-weight:500;color:#0F1F1C;letter-spacing:-.03em}.lg-hot b{font-weight:600;color:#0F766E}
/* hero */
.c-hero{position:relative;padding:130px 0 0;border-radius:0 0 40px 40px;overflow:hidden}
.c-meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid rgba(11,13,20,.1);font:500 11.5px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#4A5062}

.c-sec{padding:clamp(80px,8vw,130px) 0 0}

/* feature bento */

.c-anat{position:relative;padding:28px;border-radius:28px;background:#FFF;border:1px solid #EEF1F6}

.c-anat-lg .ml.l{left:-1px;top:-14px;bottom:-14px;width:2px}.c-anat-lg .ml.r{right:-1px;top:-14px;bottom:-14px;width:2px}.c-anat-lg .ml.t{left:56px;right:56px;top:12px;height:1px;opacity:.5}

          T({id:'visual',title:'Campaign graphics',text:'Posters for the foundation’s licence registration drives, donation appeals, awareness and anniversary events, designed to work on social media and in print.',media:[{label:'Pet licence registration drive',img:'assets/site/paw_p1.webp',ratio:'595 / 842'},{label:'Free dog licence registration drive',img:'assets/site/paw_p2.webp',ratio:'595 / 842'},{label:'Pawssible turns one',img:'assets/site/paw_p3.webp',ratio:'595 / 842'},{label:'Free pet licence drive',img:'assets/site/paw_p4.webp',ratio:'595 / 842'},{label:'Donation appeal',img:'assets/site/paw_p5.webp',ratio:'595 / 842'},{label:'Awareness: removal isn’t safety',img:'assets/site/paw_p6.webp',ratio:'595 / 842'}]}),
          T({id:'final',title:'Final website',media:[{label:'Homepage hero',img:'assets/site/paw_site.webp',ratio:'16 / 10'},{label:'Website on desktop',img:'assets/site/paw_laptop.webp',ratio:'16 / 10'}]}),
          T({id:'reflection',title:'Reflection & learning',todo:'What did designing for a non-profit teach you?'})
        ], next: { title: 'Augle AI', href: 'Case-Augle.html' } }
    };
  }
  renderVals(){
    const all = this.data();
    const p0 = all[this.props.pid] || all.hotel;
    const clean = (v) => String(v || '').replace(/\s*·?\s*\[[^\]]*\]/g, '').replace(/^\s*·\s*/, '').trim();
    const ratio = (r) => { const q = String(r).split('/').map(Number); return q[1] ? q[0] / q[1] : 1; };
    const ov = p0.sections.find(x => x.id === 'overview');
    const facts = (p0.facts || []).map(f => ({ k: f.k, v: clean(f.v) })).filter(f => f.v);
    const labels = ['In brief', 'Context', 'Direction'];
    const trio = (p0.tldr || []).slice(0, 3).map((t, i) => ({ n: '/' + (i + 1), l: labels[i], t }));
    const raw = p0.sections.filter(x => x.id !== 'overview').map(x => {
      const media = (x.media || []).filter(m => m.img);
      const cards = (x.cards || []).map(c => ({ t: c.t, d: clean(c.d) }));
      return { ...x, media, cards, text: clean(x.text) };
    }).filter(x => x.text || (x.items && x.items.length) || x.cards.length || x.media.length || x.link);
    const total = String(raw.length).padStart(2, '0');
    const sections = raw.map((x, i) => {
      const w = x.title.split(' ');
      const n = x.media.length;
      let mkind = 'grid', spans = [];
      if (n && x.media.every(m => String(m.ratio).replace(/\s/g, '') === '9/16')) { mkind = 'phones'; spans = x.media.map(() => Math.max(2, Math.floor(6 / n))); }
      else if (n && x.media.every(m => String(m.ratio).replace(/\s/g, '') === '595/842')) { mkind = 'posters'; spans = x.media.map(() => 2); }
      else if (n === 1) spans = [6];
      else if (n === 2) { const a = ratio(x.media[0].ratio), b = ratio(x.media[1].ratio); spans = (a > 1.2 && b < 1) ? [4, 2] : (b > 1.2 && a < 1) ? [2, 4] : [3, 3]; }
      else if (n > 2) { if (ratio(x.media[0].ratio) >= 1.3) { const k = n - 1, sp = k >= 3 ? 2 : (k === 2 ? 3 : 6); spans = [6].concat(x.media.slice(1).map(() => sp)); } else spans = x.media.map(() => 3); }
      const nc = x.cards.length;
      const cspan = (j) => nc === 1 ? 12 : nc === 2 ? (j === 0 ? 7 : 5) : nc === 3 ? (j === 0 ? 6 : 3) : nc === 4 ? (j < 2 ? (j === 0 ? 7 : 5) : 6) : (j === 0 ? 8 : 4);
      return {
        ...x, num: String(i + 1).padStart(2, '0'), pct: Math.round((i + 1) / raw.length * 100) + '%',
        h1: w[0], h2: w.slice(1).join(' '), cls: x.id === 'final' ? 'dark' : '',
        hasText: !!x.text, hasItems: !!(x.items && x.items.length), hasCards: nc > 0, hasMedia: n > 0, hasLink: !!x.link,
        items: (x.items || []).map((t, k) => ({ t, n: String(k + 1).padStart(2, '0'), k: k % 4 })),
        cards: x.cards.map((c, j) => ({ ...c, n: String(j + 1).padStart(2, '0'), hasD: !!c.d, span: cspan(j) })),
        mkind, media: x.media.map((m, j) => ({ ...m, fit: m.fit || 'cover', bg: m.bg || '#EEF1F6', span: spans[j] || 3 }))
      };
    });
    const p = { ...p0, facts, trio, statement: (ov && ov.text) || (p0.tldr || [''])[0], hasStLink: !!(ov && ov.link), stLink: (ov && ov.link) || { href: '#', label: '' },
      hasBand: !!p0.band, bandText: (p0.tldr || [])[2] || p0.intro,
      ptLabel: ({hotel:'Hotel Inspection',ainaa:'Ainaa',studypal:'StudyPal',parallel:'Parallel',nomnom:'Nom Nom',pawssible:'Pawssible'})[this.props.pid] || 'Case study' };
    return { p, sections, total, setRoot: this.setRoot };
  }
}
