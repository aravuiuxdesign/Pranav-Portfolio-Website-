/* ===== page transition v2 ===== */
.pt{position:fixed;inset:0;z-index:320;pointer-events:none;overflow:hidden}
.pt-a,.pt-b{position:absolute;inset:0;transform:translateY(112%);will-change:transform}
.pt-a{background:linear-gradient(135deg,#4F7BFF 0%,#2D5BFF 50%,#5B4BFF 100%)}
.pt-b{background:#0B0D14;display:flex;align-items:center;justify-content:center}
.pt-a::before,.pt-b::before,.pt-a::after,.pt-b::after{content:"";position:absolute;left:-15%;right:-15%;height:22vh;border-radius:50%;background:inherit}
.pt-a::before,.pt-b::before{top:-11vh}
.pt-a::after,.pt-b::after{bottom:-11vh}
.pt-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:26px;color:#FFF;opacity:0;transform:translateY(18px)}
.pt-mark{width:10px;height:10px;background:#FFF;transform:translate(-15px,-25px);box-shadow:10px 0 #FFF,20px 0 #FFF,0 10px #FFF,30px 10px #FFF,0 20px #FFF,30px 20px #FFF,0 30px #FFF,10px 30px #FFF,20px 30px #FFF,0 40px #FFF,0 50px #FFF;margin-bottom:-30px}
.pt-lbl{font-family:'Geist',system-ui,sans-serif;font-size:clamp(28px,3.2vw,54px);font-weight:400;letter-spacing:-.04em;line-height:1;margin-top:26px}
.pt.out{pointer-events:auto}
.pt.out .pt-a{animation:ptIn .8s cubic-bezier(.76,0,.24,1) forwards}
.pt.out .pt-b{animation:ptIn .8s cubic-bezier(.76,0,.24,1) .1s forwards}
.pt.out .pt-in{opacity:1;transform:none;transition:opacity .45s ease .5s,transform .7s cubic-bezier(.22,1,.36,1) .5s}
@keyframes ptIn{from{transform:translateY(112%)}to{transform:translateY(0)}}
.pt.arr .pt-a,.pt.arr .pt-b{transform:translateY(0)}
.pt.arr .pt-in{opacity:1;transform:none;animation:ptFade .4s ease .2s forwards}
.pt.arr .pt-b{animation:ptOut 1s cubic-bezier(.76,0,.24,1) .45s forwards}
.pt.arr .pt-a{animation:ptOut 1s cubic-bezier(.76,0,.24,1) .58s forwards}
@keyframes ptOut{to{transform:translateY(-112%)}}
@keyframes ptFade{to{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.pt{display:none}}

.vf-f b{margin-top:auto;font-size:clamp(22px,1.8vw,28px);font-weight:500;letter-spacing:-.03em;line-height:1.1;color:#0B0D14}
.vf-p{margin-top:12px;font-size:15px;line-height:1.5;color:#5E6372}
.vf-hint{margin-top:18px;font:500 11px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#9AA0B0}
.vf-b{transform:rotateY(180deg);background:#2638FF;color:#FFF;box-shadow:0 30px 60px -30px rgba(38,56,255,.6)}

.vf-bp{margin-top:16px;font-size:17px;line-height:1.45}

.vf-l{display:inline-flex;align-items:center;gap:8px;margin-top:auto;align-self:flex-start;height:44px;padding:0 18px;border-radius:99px;background:#FFF;color:#0B0D14!important;font-size:14.5px;font-weight:500}
/* journey */
.jr{position:relative;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:58px clamp(20px,5vw,112px) 10px;scrollbar-width:none;cursor:grab;-webkit-user-select:none;user-select:none}
.jr::-webkit-scrollbar{display:none}
.jr.drag{cursor:grabbing;scroll-snap-type:none}
.jr-line{position:absolute;left:0;top:38px;height:2px;width:calc(6 * 320px + 5 * 18px + 2 * clamp(20px,5vw,112px));background:repeating-linear-gradient(90deg,#C9D2EC 0 8px,transparent 8px 14px)}
.jr-c{position:relative;flex:0 0 320px;padding:46px 24px 26px;border-radius:22px;background:#FFF;border:1px solid #E7EBF2;scroll-snap-align:start;transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s}
.jr-c:hover{transform:translateY(-6px);box-shadow:0 30px 50px -34px rgba(20,35,110,.5)}
.jr-y{position:absolute;left:24px;top:-46px;font:500 13px 'Geist Mono',monospace;color:#2638FF}
.jr-dot{position:absolute;left:22px;top:-26px;width:14px;height:14px;border-radius:50%;background:#FFF;box-shadow:0 0 0 3px #2638FF}
.jr-c:last-child .jr-dot{background:#2638FF;box-shadow:0 0 0 3px #2638FF,0 0 0 9px rgba(38,56,255,.18)}
.jr-c b{display:block;font-size:22px;font-weight:500;letter-spacing:-.025em;color:#0B0D14}
.jr-c p{margin:10px 0 0;font-size:15px;line-height:1.5;color:#5E6372}
/* off the clock */
.ot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ot{position:relative;overflow:hidden;padding:28px;border-radius:24px;background:#FFF;border:1px solid #E7EBF2;min-height:220px;display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s}
.ot::before{content:"";position:absolute;right:-30%;top:-40%;width:70%;height:90%;border-radius:50%;background:radial-gradient(closest-side,var(--hb),transparent);opacity:.35;transition:opacity .5s,transform .8s cubic-bezier(.22,1,.36,1)}
.ot:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 34px 60px -40px rgba(20,35,110,.5)}
.ot:hover::before{opacity:.7;transform:scale(1.25)}
.ot-ic{position:relative;display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:16px;background:var(--hbs);color:var(--hbi);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.ot:hover .ot-ic{transform:rotate(-10deg) scale(1.08)}
.ot b{position:relative;margin-top:auto;font-size:22px;font-weight:500;letter-spacing:-.025em;color:#0B0D14}
.ot p{position:relative;margin:8px 0 0;font-size:15px;line-height:1.5;color:#5E6372}
.ot-b{--hb:#7F95FF;--hbs:#EEF1FF;--hbi:#2638FF}.ot-g{--hb:#4ADE80;--hbs:#E8FBEF;--hbi:#15803D}.ot-v{--hb:#B794FF;--hbs:#F3EDFF;--hbi:#6D28D9}
.ot-o{--hb:#FFB36B;--hbs:#FFF3E6;--hbi:#C2410C}.ot-p{--hb:#FF8FB1;--hbs:#FFEDF3;--hbi:#BE185D}.ot-c{--hb:#5EE0E6;--hbs:#E6FAFB;--hbi:#0E7490}
/* quotes */
.qt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.qt{position:relative;margin:0;display:flex;flex-direction:column;gap:24px;padding:30px;border-radius:24px;background:#FFF;border:1px solid #E7EBF2}
.qt-m{font-family:'Instrument Serif',serif;font-size:90px;line-height:.6;color:#2638FF;height:40px}
.qt blockquote{margin:0;font-size:18px;line-height:1.5;color:#0B0D14}
.qt figcaption{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:18px;border-top:1px solid #EDF0F5}
.qt-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#C7D2FF,#E9DDFF)}
.qt figcaption b{display:block;font-weight:500}
.qt figcaption small{display:block;margin-top:4px;font:500 11px 'Geist Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:#7A8094}
/* quick facts */
.qf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(32px,5vw,90px);align-items:center}
.qf-l>p{margin-top:20px}
.qf-b{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.qf-note{margin-top:14px}
.qf-card{border-radius:26px;background:#FFF;border:1px solid #E7EBF2;box-shadow:0 40px 80px -56px rgba(20,35,110,.5);overflow:hidden}
.qf-ch{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #EDF0F5;font-weight:600;font-size:15px}
.qf-st{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:99px;background:#E8FBEF;color:#15803D;font:500 12px 'Geist',sans-serif}
.qf-st i{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:qfp 1.8s ease-out infinite}
@keyframes qfp{100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.qf-g{display:grid;grid-template-columns:1fr 1fr;margin:0}
.qf-g>div{padding:18px 22px;border-bottom:1px solid #EDF0F5}
.qf-g>div:nth-child(odd){border-right:1px solid #EDF0F5}
.qf-g>div:nth-last-child(-n+2){border-bottom:0}

.qf-g dd{margin:7px 0 0;font-size:16px;font-weight:500;color:#0B0D14}
/* responsive */
