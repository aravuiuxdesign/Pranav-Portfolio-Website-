<section class="sec" id="idea">
 <div class="wrap">
  <div class="lbl" data-rv><b>01</b><span>The idea</span></div>
  <h2 data-rv>Learning should feel less scattered.</h2>
  <p class="intro" data-rv>Study Pal imagines a friendlier study system: somewhere to ask a question, make sense of a topic and keep a manageable plan. The existing website communicates that promise through a familiar student world and a small, supportive Pal.</p>
  <div class="pair" data-rv><div><span class="k">The learner</span><p>Students are the primary audience. Teachers, parents and educational institutions are also named in the concept.</p></div><div><span class="k">The work shown</span><p>An existing desktop promotional website, its visual identity and the project framing already on the portfolio.</p></div></div>
  <div class="note" data-rv><b>What this case study covers</b><p>A concept story and visual showcase. It does not establish mobile screens, a validated app journey or product performance.</p></div>
 </div>
</section>

<section class="sec tint" id="challenge">
 <div class="wrap">
  <div class="lbl" data-rv><b>02</b><span>The challenge</span></div>
  <h2 data-rv>Three barriers to a calmer study day.</h2>
  <p class="intro" data-rv>The portfolio frames the opportunity around confidence, attention and time. These are the design problems behind the concept, not findings from a documented study.</p>
  <div class="bars">
   <article class="bar" data-rv><span class="n">01</span><div class="ico" aria-hidden="true">?</div><h3>A question left unasked</h3><p>Hesitation and limited time with teachers can make it harder to clear a doubt.</p><span class="to">Make asking feel easier <i>→</i></span></article>
   <article class="bar" data-rv><span class="n">02</span><div class="ico" aria-hidden="true">▶</div><h3>A lesson, then a distraction</h3><p>Open video platforms can pull attention away from the topic a student came to learn.</p><span class="to">Keep learning focused <i>→</i></span></article>
   <article class="bar" data-rv><span class="n">03</span><div class="ico" aria-hidden="true">▦</div><h3>A plan that falls behind</h3><p>Multiple subjects and deadlines can be difficult to organise and adjust.</p><span class="to">Make the plan adaptable <i>→</i></span></article>
  </div>
 </div>
</section>

<section class="persona" id="riddhi">
 <div class="wrap pz">
  <div class="pz-l" data-rv>
   <span class="lbl lt"><b>03</b><span>A learner in focus</span></span>
   <h2>Meet Riddhi.</h2><p class="cls">Class 10 / ICSE</p>
   <p>The concept persona on the portfolio describes a determined student who wants to improve, but can feel overwhelmed by her study workload.</p>
   <p class="sm"><b>Existing concept persona.</b> Not presented as an interview participant or validated research evidence.</p>
   <svg class="star s4" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
  </div>
  <div class="pz-card" data-rv>
   <div class="pz-tabs" role="tablist" aria-label="Riddhi"><button type="button" role="tab" data-pz="0" aria-selected="true">What gets in the way</button><button type="button" role="tab" data-pz="1" aria-selected="false">What she needs</button><button type="button" role="tab" data-pz="2" aria-selected="false">How the concept responds</button></div>
   <div class="pz-panels">
    <div class="pz-p on" data-pzp="0"><span class="k">What gets in the way</span><p>Managing time, understanding complex topics and keeping track of subjects and deadlines.</p></div>
    <div class="pz-p" data-pzp="1"><span class="k">What she needs</span><p>Clear explanations, a realistic plan and a comfortable way to ask questions.</p></div>
    <div class="pz-p" data-pzp="2"><span class="k">How the concept responds</span><p>Personalised planning, video or animated explanations, reminders and easy rescheduling.</p></div>
   </div>
   <div class="pz-dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
  </div>
 </div>
</section>

<section class="sec" id="response">
 <div class="wrap">
  <div class="lbl" data-rv><b>04</b><span>The concept response</span></div>
  <h2 data-rv>One companion. Connected support.</h2>
  <p class="intro" data-rv>These are the learning priorities described in the portfolio. They are not an approved screen map or a tested sequence of interactions.</p>
  <div class="hub" data-rv>
   <ol class="pri">
    <li data-pri="0" class="on" tabindex="0"><b>01</b><div><h3>Ask without hesitation</h3><p>Friendly AI interaction and one-to-one doubt help.</p></div></li>
    <li data-pri="1" tabindex="0"><b>02</b><div><h3>Understand the topic</h3><p>Learning videos, animated explanations and short notes.</p></div></li>
    <li data-pri="2" tabindex="0"><b>03</b><div><h3>Plan around real life</h3><p>A personalised timetable that can be rescheduled.</p></div></li>
    <li data-pri="3" tabindex="0"><b>04</b><div><h3>See what is moving forward</h3><p>Progress tracking and reminders to support consistency.</p></div></li>

<section class="sec" id="site">
 <div class="wrap">
  <div class="lbl" data-rv><b>06</b><span>The existing website</span></div>
  <h2 data-rv>A clear promise at first glance.</h2>
  <p class="intro" data-rv>The original hero pairs a bold learning promise with a student cut-out, bright blue call to action and the Pal wordmark. The page introduces the idea before explaining its study tools.</p>
  <figure class="br" data-rv><div class="br-bar"><i></i><i></i><i></i><span>studypal / home</span></div><img class="" loading="lazy" decoding="async" src="assets/work/studypal/site-hero.webp" alt="Original StudyPal website hero: Learn your way and achieve more with StudyPal"></figure>
  <p class="cap" data-rv>Original website hero, unchanged. The success-rate number is unverified promotional copy in the source artwork, not an outcome of this project.</p>
  <h3 class="h3b" data-rv>From the promise to the study tools.</h3>
  <p class="intro" data-rv>Two existing sections move from a student-centred introduction to the features the concept wants to bring together.</p>
  <div class="flow">
   <figure class="br" data-rv><div class="br-bar"><i></i><i></i><i></i><span>studypal / about</span></div><img class="" loading="lazy" decoding="async" src="assets/work/studypal/site-context.webp" alt="Website section: Study smarter, not harder, with student photography"><figcaption><span class="k">Student context</span>Photography and a pale-blue panel make the learning concept feel familiar, rather than technical.</figcaption></figure>
   <div class="cards2" data-rv><figure class="tilt"><img class="" loading="lazy" decoding="async" src="assets/work/studypal/card-notes.webp" alt="Feature card: Instant short notes"></figure><figure class="tilt"><img class="" loading="lazy" decoding="async" src="assets/work/studypal/card-schedule.webp" alt="Feature card: Smart schedule"></figure></div>
