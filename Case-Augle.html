<section class="pn board aurora" id="b09" style=""><div class="meta"><span><b>Augle AI</b>&nbsp;&nbsp;Website redesign</span><span>08&nbsp;&nbsp;<b>Journey</b></span></div>
<div class="sh"><div><span class="lab">The journey</span><h2 class="h2">Seven stations. <b>One story arc.</b></h2></div><p class="p">Scrolling flies the camera from the overview into each station. Every stop pairs one moving scene with one short message, then hands off to the next. Scroll moves the camera, never the factory.</p></div>

<section class="pn board aurora" id="b10" style=""><div class="meta"><span><b>Augle AI</b>&nbsp;&nbsp;Website redesign</span><span>09&nbsp;&nbsp;<b>Robot vision</b></span></div>
<div class="sh"><div><span class="lab">Robot vision</span><h2 class="h2">Seeing the factory the way <b>Augle’s cameras do.</b></h2></div><p class="p">Augle sells computer vision, so the story gets a camera view: the live 3D factory as an inspection camera would record it. Each region of interest is tracked frame by frame, so the boxes stay locked on the torch, the robot and the part as they move.</p></div>

</div>

<section class="pn board white" id="b11" style=""><div class="meta"><span><b>Augle AI</b>&nbsp;&nbsp;Website redesign</span><span>10&nbsp;&nbsp;<b>Product thinking</b></span></div>
<div class="sh"><div><span class="lab">Product thinking</span><h2 class="h2">A factory that <b>never breaks the illusion.</b></h2></div><p class="p">The 3D factory follows three simple rules of a real production line. If it didn’t, the engineers visiting the site would notice straight away.</p></div>
<div class="stage"><div data-r class="glass beat">
  <div class="beat-top"><span class="beat-n">Rule 1</span><div class="h3">One shared clock, like a real line.</div><p class="s">Every station finishes a part every <b>11 seconds</b>, because the line can only move as fast as its slowest station: welding.</p></div>
  <div class="beat-line"><i class="beat-rail"></i><i class="beat-dot"></i><div class="bst"><span class="bn">01</span><span class="bl">Pick &amp; place</span></div><div class="bst"><span class="bn">02</span><span class="bl">Assembly</span></div><div class="bst slow"><span class="bn">03</span><span class="bl">Welding</span><em>Slowest · 11 s</em></div><div class="bst"><span class="bn">04</span><span class="bl">Painting</span></div><div class="bst"><span class="bn">05</span><span class="bl">Inspection</span></div><div class="bst"><span class="bn">06</span><span class="bl">Packaging</span></div><div class="bst"><span class="bn">07</span><span class="bl">Dispatch</span></div></div>
  <div class="beat-key"><span><i class="k1"></i>A part moves to the next station every 11 s</span><span><i class="k2"></i>Welding sets that pace</span></div>
</div></div>
<div class="grid g2" style="margin-top:clamp(30px,4vw,56px)">
  <figure data-r><div class="media" style="aspect-ratio:16/9"><img src="assets/work/augle/img/dock.jpg" alt="Mobile robot passing through dock curtains" class="" style="" loading="lazy" decoding="async"></div><figcaption style="margin-top:18px"><div class="h4"><span class="beat-n sm">Rule 2</span>Nothing pops in or out</div><p class="s" style="margin-top:6px">Parts appear only inside feeders, machines or behind dock curtains.</p></figcaption></figure>
  <figure data-r><div class="media" style="aspect-ratio:16/9"><img src="assets/work/augle/img/monitor-pass.jpg" alt="Inspection monitor showing PASS" class="" style="" loading="lazy" decoding="async"></div><figcaption style="margin-top:18px"><div class="h4"><span class="beat-n sm">Rule 3</span>No fake failures</div><p class="s" style="margin-top:6px">Inspection only ever shows PASS: there is no real defect case to stage.</p></figcaption></figure>
</div></section>

<section class="pn board white" id="b13" data-chap="ch3" style=""><div class="meta"><span><b>Augle AI</b>&nbsp;&nbsp;Website redesign</span><span>12&nbsp;&nbsp;<b>Design system</b></span></div>
